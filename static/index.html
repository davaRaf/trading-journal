/* тема применяется до отрисовки, чтобы не мигало */
/* оформление ставим до первой отрисовки, иначе мигнёт прежней темой */
try{
  var _sk = localStorage.getItem("statsai_skin") || "night";
  var _light = ["day","paper","fog","sand"];
  var _base = _light.indexOf(_sk) >= 0 ? "light" : "dark";
  if (_sk === "custom"){
    var _seed = JSON.parse(localStorage.getItem("statsai_skin_custom") || "{}");
    _base = _seed.base === "light" ? "light" : "dark";
    if (_seed.bg) document.documentElement.style.setProperty("--seed-bg", _seed.bg);
    if (_seed.accent) document.documentElement.style.setProperty("--seed-accent", _seed.accent);
    document.documentElement.style.setProperty("--seed-ink", _base === "light" ? "#171b24" : "#f4f5f7");
  }
  document.documentElement.setAttribute("data-skin", _sk);
  document.documentElement.setAttribute("data-theme", _base);
}catch(e){ document.documentElement.setAttribute("data-theme","dark"); }
if(!document.documentElement.getAttribute("data-theme"))document.documentElement.setAttribute("data-theme","dark");
document.documentElement.setAttribute("data-layout","classic");
try{document.documentElement.setAttribute("data-nav",localStorage.getItem("tj_nav")||"flat");}catch(e){document.documentElement.setAttribute("data-nav","flat");}
</script>
