<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatsAI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><path d='M24 5L43 43H5L24 5Z' fill='%2340e094'/><path d='M30 26C30 22.6 19 22.6 19 26.6C19 30.6 30 30.6 30 34.4C30 38.2 19 38.2 19 35' stroke='%23050505' stroke-width='4.4' stroke-linecap='round' fill='none'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Archivo:wght@400;500;600&display=swap">
<style>
/* Публічна сторінка: її бачить той, кому дали посилання.
   Ані журналу, ані акаунта в нього немає — лише цей знімок. */
:root{
  --bg:#f2f4f8; --panel:#ffffff; --panel-2:#f6f8fb; --line:#dde3ec; --line-soft:#eaeef5;
  --text:#171b24; --dim:#5a6373; --faint:#99a2b3;
  --up:#128a53; --down:#c94430; --be:#9c7514;
  --up-soft:rgba(18,138,83,.10); --down-soft:rgba(201,68,48,.10); --be-soft:rgba(156,117,20,.12);
  --card:var(--panel); --g:#128a53;
  --sans:"Geist","Segoe UI",system-ui,sans-serif;
  /* той самий набір, що в журналі: цифри мають виглядати однаково
     і на сторінці, і на сайті */
  --mono:"Archivo","Geist","Segoe UI",system-ui,sans-serif;
  --r:12px; --ease:cubic-bezier(.16,1,.3,1);
}
:root[data-theme="dark"]{
  --bg:#08080a; --panel:rgba(255,255,255,.045); --panel-2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.055);
  --text:#f0f0f1; --dim:#94949a; --faint:#63636b;
  --up:#4fd18f; --down:#f2645f; --be:#efc258;
  --up-soft:rgba(79,209,143,.14); --down-soft:rgba(242,100,95,.13); --be-soft:rgba(239,194,88,.13);
  --card:linear-gradient(180deg,rgba(255,255,255,.062),rgba(255,255,255,.016));
  --g:#40e094;
}
*{box-sizing:border-box}
/* Смуга прокрутки. Сторінку гортати можна як завжди, просто саму смугу не
   малюємо: коли розкриваєш угоду, вміст стає вищим за екран, смуга
   з'являється і зсуває всю сторінку вбік на свою ширину. */
html{scrollbar-width:none}
html::-webkit-scrollbar{width:0; height:0}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  -webkit-font-smoothing:antialiased}
/* журнал позаду: тільки картинка, ніяких кліків */
.bgapp{position:fixed; inset:0; width:100%; height:100%; border:0; z-index:0;
  filter:blur(7px) saturate(.85); transform:scale(1.03); pointer-events:none}
/* поле, на якому лежить карта зі знімком */
.stage{position:fixed; inset:0; z-index:2; display:grid; place-items:center;
  /* колонка мінімальної ширини 0: інакше широкий вміст (кпі, деталі угоди)
     розсуває карту ширше за екран, і на телефоні її край зрізає */
  grid-template-columns:minmax(0,1fr);
  height:100dvh;
  padding:clamp(10px,3vw,28px); background:rgba(0,0,0,.55); overflow:auto;
  scrollbar-width:none}
.stage::-webkit-scrollbar{width:0}
.sheet{position:relative; width:min(760px,100%); max-width:100%; min-width:0;
  max-height:100%; display:flex; flex-direction:column;
  background:var(--bg); border:1px solid var(--line); border-radius:16px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.75); overflow:hidden;
  animation:sheetIn .45s cubic-bezier(.16,1,.3,1) both}
/* Смуги прокрутки не видно (щоб не смикала сторінку), тому підказуємо
   інакше: поки внизу лишився вміст — край карти м'яко згасає. */
.sheet::after{content:""; position:absolute; left:1px; right:1px; bottom:1px; height:54px;
  border-radius:0 0 15px 15px; pointer-events:none; opacity:0; transition:opacity .2s;
  background:linear-gradient(to top, var(--bg), transparent)}
.sheet.more::after{opacity:1}
@keyframes sheetIn{from{opacity:0; transform:translateY(16px) scale(.985)}}
.sheet-top{display:flex; align-items:center; gap:10px; padding:13px 16px;
  border-bottom:1px solid var(--line-soft); flex:none}
.sheet-top .mk{width:26px; height:26px; display:grid; place-items:center}
.sheet-top .mk svg{width:15px; height:auto; color:var(--text)}
.sheet-top .who{font-size:13px; color:var(--dim)}
.sheet-top .who{font-family:var(--mono); font-size:14px; font-weight:500;
  letter-spacing:-.01em; color:var(--text)}
.sheet-top .who i{font-style:normal; color:var(--g)}
.sheet-top .sp{flex:1}
.sheet-top .x{width:30px; height:30px; border-radius:8px; border:1px solid var(--line);
  background:none; color:var(--dim); font-size:17px; line-height:1; cursor:pointer;
  display:grid; place-items:center; padding:0}
.sheet-top .x:hover{border-color:var(--dim); color:var(--text)}
/* min-height:0 — без нього гортати не виходило: вміст, що не вліз
   (розгорнута угода зі скрінами), просто зрізався краєм карти. Елемент
   у flex-колонці за замовчуванням не стискається менше свого вмісту,
   тому overflow-y тут нічого не давав. */
.wrap{flex:1 1 auto; min-height:0;
  padding:22px 20px 26px; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  display:flex; flex-direction:column; gap:16px}
/* Через це скріни й не було видно: блоки в колонці за замовчуванням
   стискаються, аби вміститись. Розгорнута угода ужималась до вільного
   місця, а overflow:hidden у списку зрізав усе, що не влізло, — і
   гортати не було чого, бо формально «все вмістилось». */
.wrap>*{flex:none}
.wrap::-webkit-scrollbar{width:0}

.brand{display:flex; align-items:center; gap:10px; margin-bottom:6px}
.brand svg{height:26px; width:auto; aspect-ratio:902/1315; color:var(--text)}
.brand .nm{font-family:var(--mono); font-size:15px; font-weight:500; letter-spacing:-.01em}
.brand .nm i{font-style:normal; color:var(--g)}

.head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
h1{margin:0; font-size:clamp(22px,4vw,30px); font-weight:600; letter-spacing:-.025em}
.sub{font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint)}
.total{font-family:var(--mono); font-size:clamp(28px,6vw,42px); font-weight:500;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1}
.total.pos{color:var(--up)} .total.neg{color:var(--down)} .total.zero{color:var(--dim)}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:1px;
  background:var(--line-soft); border:1px solid var(--line-soft); border-radius:var(--r);
  overflow:hidden}
.kpi{background:var(--bg); padding:15px 17px; display:flex; flex-direction:column; gap:5px}
.kpi .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--faint)}
.kpi .v{font-family:var(--mono); font-size:19px; font-weight:500;
  font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.kpi .v.pos{color:var(--up)} .kpi .v.neg{color:var(--down)}

.rows{display:flex; flex-direction:column; gap:1px; background:var(--line-soft);
  border:1px solid var(--line-soft); border-radius:var(--r); overflow:hidden}
.row{background:var(--bg); padding:12px 17px; display:flex; align-items:center;
  justify-content:space-between; gap:14px; font-size:14px}
.row .l{color:var(--dim); min-width:0}
.row .r{font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.row .r.pos{color:var(--up)} .row .r.neg{color:var(--down)}

.sect{font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint); margin:8px 0 -6px}

/* заклик зайти в журнал — під самим знімком */
.cta{margin-top:22px; padding:20px; border:1px solid var(--line); border-radius:12px;
  background:var(--panel-2)}
.cta .t{font-size:16px; font-weight:600; letter-spacing:-.01em}
.cta p{margin:6px 0 14px; font-size:13.5px; line-height:1.55; color:var(--dim)}
.cta .btns{display:flex; gap:9px; flex-wrap:wrap}
.cta .b{display:inline-flex; align-items:center; justify-content:center; text-decoration:none;
  border:1px solid var(--line); border-radius:9px; padding:9px 14px; font-size:13.5px;
  font-weight:500; color:var(--text); background:var(--panel)}
.cta .b:hover{border-color:var(--dim)}
.cta .b.pri{background:var(--g); border-color:var(--g); color:var(--bg)}
.foot{margin-top:16px; padding-top:18px; border-top:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  font-size:12.5px; color:var(--faint)}
.foot a{color:var(--g); text-decoration:none}
.foot a:hover{text-decoration:underline}

.msg{padding:56px 24px; text-align:center; color:var(--dim); font-size:15px; line-height:1.6;
  border:1px dashed var(--line); border-radius:var(--r)}
.msg b{display:block; color:var(--text); font-size:18px; margin-bottom:8px}

/* ---------- угоди дня, які можна розгорнути ---------- */
.trades{display:flex; flex-direction:column; border:1px solid var(--line-soft);
  border-radius:var(--r); overflow:hidden; background:var(--card)}
.tr{border-top:1px solid var(--line-soft)}
.tr:first-child{border-top:none}
.tr>summary{display:grid; grid-template-columns:auto 1fr auto auto; gap:12px; align-items:center;
  padding:13px 16px; cursor:pointer; list-style:none; transition:background .15s}
.tr>summary::-webkit-details-marker{display:none}
.tr>summary:hover{background:var(--panel-2)}
.tr .tm{font-family:var(--mono); font-size:12.5px; color:var(--faint)}
.tr .nm{font-size:14.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tr .rs{font-family:var(--mono); font-size:11px; letter-spacing:.06em; padding:3px 9px;
  border-radius:99px; background:var(--panel-2); color:var(--dim)}
.tr .rs.pos{background:var(--up-soft); color:var(--up)}
.tr .rs.neg{background:var(--down-soft); color:var(--down)}
.tr .rs.be{background:var(--be-soft); color:var(--be)}
.tr .val{font-family:var(--mono); font-size:15px; min-width:66px; text-align:right}
.tr .val.pos{color:var(--up)} .tr .val.neg{color:var(--down)} .tr .val.zero{color:var(--be)}
.tr[open]>summary{background:var(--panel-2)}

/* Розкриття угоди.
   Браузер підставляє вміст <details> ривком, тому висоту анімуємо самі
   (::details-content + interpolate-size). Де така анімація не працює,
   картка просто відкриється миттєво, як і раніше — нічого не ламається. */
html{interpolate-size:allow-keywords}
.tr::details-content{block-size:0; overflow:hidden;
  transition:block-size .3s cubic-bezier(.22,.61,.36,1), content-visibility .3s;
  transition-behavior:allow-discrete}
.tr[open]::details-content{block-size:auto}

.tbody{padding:4px 16px 18px}
.facts{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:0 22px}
.facts .f{display:flex; justify-content:space-between; gap:14px; padding:9px 0;
  border-bottom:1px solid var(--line-soft); font-size:13.5px}
.facts .f span:first-child{color:var(--faint)}
.txt{margin-top:14px}
.txt .lab{font-family:var(--mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--faint); margin-bottom:6px}
.txt p{margin:0 0 12px; font-size:14px; line-height:1.6; color:var(--dim); white-space:pre-wrap}
.shots{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;
  margin-top:14px}
.shots figure{margin:0; border:1px solid var(--line-soft); border-radius:10px; overflow:hidden;
  background:var(--panel-2); cursor:zoom-in}
/* Розміру картинки ми заздалегідь не знаємо, а поки вона не завантажилась,
   висота нульова. Через це сторінка при відкритті угоди двічі-тричі
   перекладалась і смикалась. Тримаємо місце під графік наперед: пропорція
   стала, а сама картинка вписується в неї без обрізання. */
.shots img{width:100%; display:block; aspect-ratio:16/9; object-fit:contain;
  background:var(--panel-2); opacity:0; transition:opacity .2s}
.shots img.rdy{opacity:1}
.shots figcaption{font-family:var(--mono); font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--faint); padding:6px 8px}
.big{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.86); display:flex;
  align-items:center; justify-content:center; padding:20px; cursor:zoom-out}
.big img{max-width:100%; max-height:100%; border-radius:8px}
.hintline{font-size:12.5px; color:var(--faint); margin:-6px 0 0}

/* ---------- торгова стратегія ----------
   Правила читають зверху вниз, тож і подаємо їх розділами: ринок і час,
   таймфрейми, вхід, ризик, супровід, коли не входжу, чек-лист. Скрізь та
   сама сітка «підпис — значення», щоб очі не перебудовувались. */
.ts{display:flex; flex-direction:column; gap:12px}
.ts-s{border:1px solid var(--line-soft); border-radius:var(--r); overflow:hidden;
  background:var(--card)}
.ts-s > .h{padding:11px 15px; background:var(--panel-2); border-bottom:1px solid var(--line-soft);
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--faint)}
.ts-s > .b{padding:14px 15px; display:flex; flex-direction:column; gap:14px}
.ts-sub{font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--faint); margin-bottom:8px}

.ts-chips{display:flex; flex-wrap:wrap; gap:7px}
.ts-chips b{font-family:var(--mono); font-size:13px; font-weight:600; padding:6px 12px;
  border-radius:8px; background:var(--panel-2); border:1px solid var(--line-soft)}

.ts-rows{display:flex; flex-direction:column; gap:1px; background:var(--line-soft);
  border:1px solid var(--line-soft); border-radius:9px; overflow:hidden}
.ts-rows .r{display:grid; grid-template-columns:150px 1fr; gap:4px 12px; padding:10px 12px;
  background:var(--bg); align-items:baseline}
.ts-rows .k{font-size:12.5px; color:var(--faint)}
.ts-rows .v{font-size:13.5px; line-height:1.55; color:var(--dim); white-space:pre-wrap}
.ts-rows .v b{color:var(--text); font-weight:600; font-family:var(--mono)}

.ts-tf{border:1px solid var(--line-soft); border-radius:9px; padding:12px 13px;
  background:var(--panel-2); display:flex; flex-direction:column; gap:8px}
.ts-tf .top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.ts-tf .n{font-family:var(--mono); font-size:14px; font-weight:600}
.ts-tf .role{font-size:12px; color:var(--faint)}
.ts-tf .what{font-size:13px; line-height:1.55; color:var(--dim); white-space:pre-wrap}
.ts-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px}

.ts-mod{border:1px solid var(--line-soft); border-radius:9px; padding:12px 13px;
  background:var(--panel-2); display:flex; flex-direction:column; gap:8px}
.ts-mod .nm{font-family:var(--mono); font-size:14px; font-weight:600}
.ts-mod .note{font-size:13px; line-height:1.55; color:var(--dim); white-space:pre-wrap}

.ts-no{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
.ts-no .col .h{font-family:var(--mono); font-size:9px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint); margin-bottom:8px}
.ts-no ul{margin:0; padding-left:17px; display:flex; flex-direction:column; gap:6px}
.ts-no li{font-size:13px; line-height:1.5; color:var(--dim)}
.ts-no .none{font-size:12.5px; color:var(--faint); margin:0}

.ts-check{display:flex; flex-direction:column; gap:1px; background:var(--line-soft);
  border:1px solid var(--line-soft); border-radius:9px; overflow:hidden}
.ts-check div{display:flex; gap:10px; padding:10px 12px; background:var(--bg);
  font-size:13px; line-height:1.5; color:var(--dim)}
.ts-check div i{font-style:normal; color:var(--faint); font-family:var(--mono);
  font-size:11px; flex:none; padding-top:2px}

.ts-mind{border-left:2px solid var(--g); padding:12px 14px; background:var(--panel-2);
  border-radius:0 9px 9px 0; font-size:13.5px; line-height:1.6; color:var(--text);
  white-space:pre-wrap}

@media (max-width:560px){
  .ts-rows .r{grid-template-columns:1fr}
  .ts-grid{grid-template-columns:1fr}
}

/* ---------- розбір дня ----------
   Головне тут не цифри, а хід думки: куди людина дивилась, які рівні
   відмітила, що планувала — і що з цього вийшло. Тому кожен актив іде
   карткою: графіки, напрям, рівні, сценарії, а нижче вечір. На телефоні
   все складається в одну колонку. */
.rv{display:flex; flex-direction:column; gap:12px}
.rv-a{border:1px solid var(--line-soft); border-radius:var(--r); overflow:hidden;
  background:var(--card)}
.rv-h{display:flex; align-items:center; gap:10px; padding:12px 15px; background:var(--panel-2);
  border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.rv-h .nm{font-family:var(--mono); font-size:14.5px; font-weight:600; letter-spacing:.02em}
.rv-h .side{font-family:var(--mono); font-size:10px; letter-spacing:.1em; padding:3px 9px;
  border-radius:99px; background:var(--panel-2); color:var(--dim)}
.rv-h .side.long{background:var(--up-soft); color:var(--up)}
.rv-h .side.short{background:var(--down-soft); color:var(--down)}
.rv-h .sp{flex:1}
.rv-h .net{font-family:var(--mono); font-size:14px}
.rv-h .net.pos{color:var(--up)} .rv-h .net.neg{color:var(--down)} .rv-h .net.zero{color:var(--be)}
.rv-b{padding:14px 15px; display:flex; flex-direction:column; gap:16px}
.rv-p{display:flex; align-items:baseline; gap:9px; margin-bottom:9px}
.rv-p b{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--g); background:color-mix(in srgb, var(--g) 14%, transparent);
  padding:3px 7px; border-radius:99px; font-weight:600}
.rv-p.eve b{color:var(--be); background:var(--be-soft)}
.rv-p span{font-size:13.5px; font-weight:600}
.rv-say{font-size:13.5px; line-height:1.6; color:var(--dim); white-space:pre-wrap}

.rv-lv{display:flex; flex-direction:column; gap:1px; background:var(--line-soft);
  border:1px solid var(--line-soft); border-radius:9px; overflow:hidden}
.rv-lv .r{display:grid; grid-template-columns:88px 1fr; gap:4px 10px; padding:9px 12px;
  background:var(--bg); align-items:baseline}
.rv-lv .p{font-family:var(--mono); font-size:13.5px}
.rv-lv .t{font-size:13px; color:var(--dim)}
.rv-lv .t i{font-style:normal; color:var(--faint)}
.rv-lv .did{grid-column:2; font-size:12.5px; color:var(--faint); display:flex; gap:7px;
  align-items:baseline}
.rv-lv .hit{font-family:var(--mono); font-size:11px; flex:none}
.rv-lv .hit.ok{color:var(--up)} .rv-lv .hit.no{color:var(--down)} .rv-lv .hit.mid{color:var(--be)}

.rv-sc{display:flex; flex-direction:column; gap:8px}
.rv-sc .s{display:flex; gap:11px; padding:11px 13px; border-radius:9px; background:var(--panel-2);
  border:1px solid var(--line-soft)}
.rv-sc .s .k{font-family:var(--mono); font-size:13px; color:var(--faint); flex:none; width:14px}
.rv-sc .s .tx{flex:1; min-width:0; font-size:13px; line-height:1.55; color:var(--dim)}

.rv-marks{display:flex; gap:10px; flex-wrap:wrap}
.rv-marks .m{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--dim);
  background:var(--panel-2); border:1px solid var(--line-soft); border-radius:99px;
  padding:6px 12px}
.rv-marks .m i{width:7px; height:7px; border-radius:50%; flex:none}
.rv-marks .m i.y{background:var(--up)} .rv-marks .m i.n{background:var(--down)}
.rv-marks .m i.p{background:var(--be)}
.rv-marks .m b{font-weight:600; color:var(--text)}

.rv-note{border:1px solid var(--line-soft); border-radius:var(--r); padding:14px 15px;
  background:var(--card)}
.rv-note .lab{font-family:var(--mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--faint); margin-bottom:7px}
.rv-note p{margin:0; font-size:13.5px; line-height:1.6; color:var(--dim); white-space:pre-wrap}

@media (max-width:560px){
  .rv-lv .r{grid-template-columns:1fr}
  .rv-lv .did{grid-column:1}
}

/* ---------- календар днів (тиждень і місяць) ----------
   Знімок періоду — це не тільки підсумкова цифра. Тут видно, як лягли
   дні, і в кожен можна зайти: угоди зі скрінами відкриваються під
   сіткою, не забираючи людину зі сторінки. */
.cal{border:1px solid var(--line-soft); border-radius:var(--r); overflow:hidden;
  background:var(--card)}
.cal .wd{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line-soft)}
.cal .wd span{padding:9px 4px; text-align:center; font-family:var(--mono); font-size:9px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.cal .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line-soft);
  padding:1px}
.cal .dc{background:var(--bg); min-height:74px; padding:8px 9px; display:flex;
  flex-direction:column; gap:4px; border:0; font:inherit; text-align:left; color:inherit}
.cal .dc.pad{background:transparent}
.cal .dc .n{font-family:var(--mono); font-size:11.5px; color:var(--faint); line-height:1}
.cal .dc .v{font-family:var(--mono); font-size:15px; line-height:1.1; margin-top:auto;
  font-variant-numeric:tabular-nums}
.cal .dc .c{font-size:10.5px; color:var(--faint); line-height:1}
.cal .dc.has{cursor:pointer; transition:background .15s}
.cal .dc.has:hover{background:var(--panel-2)}
.cal .dc.has .n{color:var(--dim)}
.cal .dc.pos{background:color-mix(in srgb, var(--up) 9%, var(--bg))}
.cal .dc.pos:hover{background:color-mix(in srgb, var(--up) 15%, var(--bg))}
.cal .dc.pos .v{color:var(--up)}
.cal .dc.neg{background:color-mix(in srgb, var(--down) 9%, var(--bg))}
.cal .dc.neg:hover{background:color-mix(in srgb, var(--down) 15%, var(--bg))}
.cal .dc.neg .v{color:var(--down)}
.cal .dc.zero .v{color:var(--be)}
.cal .dc.on{box-shadow:inset 0 0 0 1.5px var(--g)}
/* тиждень — сім клітинок у ряд, їм можна дати більше повітря */
.cal.week .dc{min-height:92px}

/* день, який розкрили під сіткою */
.dayopen{margin-top:12px; border:1px solid var(--line-soft); border-radius:var(--r);
  overflow:hidden}
.dayopen .dh{display:flex; align-items:baseline; gap:10px; padding:12px 15px;
  background:var(--panel-2); border-bottom:1px solid var(--line-soft)}
.dayopen .dh b{font-size:14.5px; font-weight:600}
.dayopen .dh .sub{font-family:var(--mono); font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint)}
.dayopen .dh .tot{margin-left:auto; font-family:var(--mono); font-size:16px}
.dayopen .dh .tot.pos{color:var(--up)} .dayopen .dh .tot.neg{color:var(--down)}
.dayopen .dh .tot.zero{color:var(--be)}
.dayopen .inner{padding:14px 15px}
.dayopen .inner .sect{margin-top:0}
.dayopen .inner .trades{margin-top:0}

@media (max-width:560px){
  .cal .dc{min-height:58px; padding:6px}
  .cal.week .dc{min-height:64px}
  .cal .dc .v{font-size:12.5px}
  .cal .dc .c{display:none}
}
</style>
</head>
<body>
<!-- Журнал позаду. Він розмитий і не клікається: показує, що знімок
     зроблено не в порожнечі, а в живому продукті. Закриєш карту —
     потрапиш у нього по-справжньому. -->
<iframe class="bgapp" src="/demo" tabindex="-1" aria-hidden="true" title=""></iframe>

<div class="stage" id="stage">
  <div class="sheet" id="sheet">
    <div class="sheet-top">
      <span class="mk" id="sheetMark"></span>
      <span class="who" id="sheetWho">StatsAI</span>
      <span class="sp"></span>
      <button class="x" id="sheetClose" type="button" aria-label="Закрити">×</button>
    </div>
    <div class="wrap" id="wrap">
      <div class="msg" id="shLoadingMsg">Завантаження…</div>
    </div>
  </div>
</div>

<script src="/static/i18n.js"></script>
<script>
const MARK = "<svg viewBox=\"573 366 902 1315\" aria-hidden=\"true\"><path transform=\"translate(0,0)\" fill=\"var(--g)\" d=\"M 1007.73 417.867 C 1012.96 407.472 1022.43 403.074 1033.28 408.302 C 1044.26 413.587 1041.3 436.645 1041.28 447.276 L 1041.16 500.837 C 1041.03 559.942 1042.37 622.699 1040.98 681.397 C 1041.86 686.293 1067.84 728.571 1072.19 736.023 L 1174.17 909.911 L 1090.84 909.91 C 1043.39 909.921 1001.55 904.752 964.567 941.347 C 943.67 962.177 931.992 990.513 932.146 1020.02 C 932.11 1049.34 943.509 1078.75 964.485 1099.42 C 980.427 1114.93 1000.76 1125.16 1022.72 1128.71 C 1042.29 1131.77 1078.91 1127.86 1092.5 1131.48 C 1105.78 1135.12 1114.96 1147.22 1114.88 1160.99 C 1114.77 1199.93 1067.21 1191.64 1040.77 1191.58 L 946.808 1191.77 C 921.351 1165.65 896.502 1138.93 872.279 1111.66 C 860.111 1130.48 848.698 1150.33 837.098 1169.56 C 816.464 1203.51 796.056 1237.59 775.874 1271.81 L 993.674 1271.93 L 1055.86 1271.88 C 1100.21 1271.8 1134.64 1273.2 1168.73 1238.91 C 1189.33 1217.81 1200.69 1189.37 1200.29 1159.89 C 1200.15 1130.6 1190.28 1103.4 1169.26 1082.6 C 1152.78 1066.48 1131.7 1055.89 1108.92 1052.3 C 1086.87 1048.86 1057.05 1054.56 1036.53 1048.43 C 1010.67 1040.71 1012.03 992.508 1043.02 990.261 C 1063.65 988.886 1084.63 989.833 1105.32 989.979 L 1220.58 989.922 L 1434.91 1357.49 L 1158.98 1357.8 L 1079.96 1357.75 C 1071.4 1357.73 1049.21 1357.11 1041.3 1358 L 1041.14 1538.09 L 1041.3 1594.17 C 1041.34 1604.03 1041.86 1615.95 1041.16 1625.6 C 1039.85 1643.54 1015.04 1647.32 1007.77 1629.23 C 1006.7 1623.59 1007.04 1606.7 1007.06 1600.06 L 1007.17 1551.24 L 1007.07 1357.74 L 612.894 1357.86 C 654.064 1291.27 693.944 1219.52 733.687 1151.66 L 1007.18 683.395 C 1006.3 626.487 1007.22 567.336 1007.12 510.216 L 1007.01 452.565 C 1006.99 442.982 1006.55 426.917 1007.73 417.867 z\"/> <path transform=\"translate(0,0)\" fill=\"currentColor\" d=\"M 1007.77 1358.05 L 1041.3 1358 L 1041.14 1538.09 L 1041.3 1594.17 C 1041.34 1604.03 1041.86 1615.95 1041.16 1625.6 C 1039.85 1643.54 1015.04 1647.32 1007.77 1629.23 C 1009.05 1603.41 1007.95 1565.83 1007.96 1539.15 L 1007.77 1358.05 z\"/> <path transform=\"translate(0,0)\" fill=\"currentColor\" d=\"M 1007.73 417.867 C 1012.96 407.472 1022.43 403.074 1033.28 408.302 C 1044.26 413.587 1041.3 436.645 1041.28 447.276 L 1041.16 500.837 C 1041.03 559.942 1042.37 622.699 1040.98 681.397 C 1035.71 674.277 1029.82 662.763 1024.31 654.534 C 1018.61 663.506 1013.14 672.625 1007.92 681.882 C 1007.27 653.296 1008.22 624.592 1008 596 C 1007.55 536.664 1008.45 477.184 1007.73 417.867 z\"/></svg>";

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sign = v => (v > 0.0001 ? "pos" : v < -0.0001 ? "neg" : "zero");
const pct  = v => (v == null || isNaN(v)) ? "—" : (v > 0 ? "+" : "") + (Math.round(v*100)/100) + "%";

function kpi(k, v, cls){
  return '<div class="kpi"><span class="k">'+esc(k)+'</span>'
       + '<span class="v'+(cls?" "+cls:"")+'">'+esc(v)+'</span></div>';
}

/* Угоди зі знімка: згорнуті рядки, які розкриваються в повну картку —
   з тим, що людина записала, і зі скрінами. */
function tradesHtml(list){
  if (!list || !list.length) return "";
  /* коли угода одна — вона й є весь знімок, тримати її згорнутою безглуздо */
  const alone = list.length === 1;
  const one = t => {
    const facts = (t.info || []).map(f =>
      '<div class="f"><span>'+esc(f.k)+'</span><span>'+esc(f.v)+'</span></div>').join("");
    const texts = (t.texts || []).map(x =>
      '<div class="txt"><div class="lab">'+esc(x.k)+'</div><p>'+esc(x.v)+'</p></div>').join("");
    const shots = (t.shots || []).map(sh =>
      '<figure data-src="'+esc(shotUrl(sh.file))+'"><img loading="lazy" alt=""'
      + ' onload="this.classList.add(&quot;rdy&quot;)"'
      + ' onerror="this.classList.add(&quot;rdy&quot;)" src="'
      + esc(shotUrl(sh.file)) + '">'
      + (sh.tf ? '<figcaption>'+esc(sh.tf)+'</figcaption>' : '') + '</figure>').join("");
    return '<details class="tr"' + (alone ? " open" : "") + '><summary>'
      + '<span class="tm">'+esc(t.time || "")+'</span>'
      + '<span class="nm">'+esc(t.pair || "")+'</span>'
      + '<span class="rs '+(t.cls||"")+'">'+esc(t.result || "")+'</span>'
      + '<span class="val '+sign(t.net)+'">'+pct(t.net)+'</span>'
      + '</summary><div class="tbody">'
      + (facts ? '<div class="facts">'+facts+'</div>' : '')
      + texts
      + (shots ? '<div class="shots">'+shots+'</div>' : '')
      + '</div></details>';
  };
  return (alone ? "" : '<div class="sect">' + esc(T.slTradesTitle || "Угоди") + '</div>'
                        + '<p class="hintline">' + esc(T.shExpandHint) + '</p>')
    + '<div class="trades">' + list.map(one).join("") + '</div>';
}

/* ---------- торгова стратегія ---------- */
function tsHtml(ts){
  if (!ts) return "";

  const shotsHtml = list => !list || !list.length ? "" :
    '<div class="shots">' + list.map(sh =>
      '<figure data-src="' + esc(shotUrl(sh.file)) + '"><img loading="lazy" alt=""'
      + ' onload="this.classList.add(&quot;rdy&quot;)"'
      + ' onerror="this.classList.add(&quot;rdy&quot;)" src="' + esc(shotUrl(sh.file)) + '">'
      + (sh.tf ? "<figcaption>" + esc(sh.tf) + "</figcaption>" : "") + "</figure>").join("")
    + "</div>";

  const sec = (title, body) => !body ? "" :
    '<div class="ts-s"><div class="h">' + esc(title) + '</div><div class="b">' + body + "</div></div>";
  const sub = (title, body) => !body ? "" :
    '<div><div class="ts-sub">' + esc(title) + "</div>" + body + "</div>";
  const rows = list => {
    const rs = (list || []).filter(r => r[1]);
    return !rs.length ? "" : '<div class="ts-rows">' + rs.map(r =>
      '<div class="r"><span class="k">' + esc(r[0]) + '</span>'
      + '<span class="v">' + esc(r[1]) + "</span></div>").join("") + "</div>";
  };

  /* ринок і час */
  const assets = ts.assets.length
    ? '<div class="ts-chips">' + ts.assets.map(a => "<b>" + esc(a) + "</b>").join("") + "</div>" : "";
  const windows = rows(ts.windows.map(w =>
    [w.name || "—", [w.time, w.note].filter(Boolean).join("  ·  ")]));
  const when = rows([[T.tsShDays, ts.days], [T.tsShNews, ts.news]]);
  const market = sub(T.tsShAssets, assets) + sub(T.tsShWindows, windows) + when;

  /* таймфрейми */
  const tfs = !ts.tfs.length ? "" :
    '<div class="ts-grid">' + ts.tfs.map(r =>
      '<div class="ts-tf"><div class="top"><span class="n">' + esc(r.tf || "—") + "</span>"
      + (r.role ? '<span class="role">' + esc(r.role) + "</span>" : "") + "</div>"
      + (r.what ? '<div class="what">' + esc(r.what) + "</div>" : "")
      + shotsHtml(r.shots) + "</div>").join("") + "</div>";

  /* вхід */
  const models = !ts.models.length ? "" :
    '<div class="ts-grid">' + ts.models.map(m =>
      '<div class="ts-mod"><span class="nm">' + esc(m.name || "—") + "</span>"
      + (m.note ? '<div class="note">' + esc(m.note) + "</div>" : "")
      + shotsHtml(m.shots) + "</div>").join("") + "</div>";
  const entryRules = rows([[T.tsShBias, ts.bias], [T.tsShStop, ts.stop.v],
                           [T.tsShTarget, ts.target.v]]);
  const entryShots = shotsHtml((ts.stop.shots || []).concat(ts.target.shots || []));
  const entry = sub(T.tsShModels, models) + sub(T.tsShRules, entryRules + entryShots);

  /* ризик */
  const cases = rows(ts.riskCases.map(c => [c.k || "—", c.v]));
  const risk = sub(T.tsShCases, cases);

  /* супровід */
  const manage = !ts.manage.length ? "" :
    ts.manage.map(m =>
      '<div>' + rows([[m.k || "—", m.v]]) + shotsHtml(m.shots) + "</div>").join("");

  /* коли не входжу */
  const col = (title, items) => '<div class="col"><div class="h">' + esc(title) + "</div>"
    + (items.length ? "<ul>" + items.map(v => "<li>" + esc(v) + "</li>").join("") + "</ul>"
                    : '<p class="none">—</p>') + "</div>";
  const noAny = ts.no.market.length || ts.no.time.length || ts.no.self.length;
  const no = (noAny ? '<div class="ts-no">' + col(T.tsShNoMarket, ts.no.market)
        + col(T.tsShNoTime, ts.no.time) + col(T.tsShNoSelf, ts.no.self) + "</div>" : "")
    + (ts.mind ? '<div class="ts-mind">' + esc(ts.mind) + "</div>" : "");

  /* чек-лист */
  const check = !ts.check.length ? "" :
    '<div class="ts-check">' + ts.check.map((c, i) =>
      "<div><i>" + String(i + 1).padStart(2, "0") + "</i><span>" + esc(c) + "</span></div>").join("")
    + "</div>";

  const body = sec(T.tsShMarket, market) + sec(T.tsShTfs, tfs) + sec(T.tsShEntry, entry)
    + sec(T.tsShRisk, risk) + sec(T.tsShManage, manage) + sec(T.tsShNo, no)
    + sec(T.tsShCheck, check);
  return body ? '<div class="ts">' + body + "</div>" : "";
}

/* ---------- розбір дня ---------- */
function reviewHtml(rv){
  if (!rv || !(rv.assets || []).length) return "";

  const mkMark = (lab, v) => !v ? "" :
    '<span class="m"><i class="' + markTone(v) + '"></i>'
    + esc(lab) + " <b>" + esc(v) + "</b></span>";

  const shotsHtml = list => !list || !list.length ? "" :
    '<div class="shots">' + list.map(sh =>
      '<figure data-src="' + esc(shotUrl(sh.file)) + '"><img loading="lazy" alt=""'
      + ' onload="this.classList.add(&quot;rdy&quot;)"'
      + ' onerror="this.classList.add(&quot;rdy&quot;)" src="' + esc(shotUrl(sh.file)) + '">'
      + (sh.tf ? "<figcaption>" + esc(sh.tf) + "</figcaption>" : "") + "</figure>").join("")
    + "</div>";

  const part = (n, title, eve) => '<div class="rv-p' + (eve ? " eve" : "") + '"><b>' + n
    + "</b><span>" + esc(title) + "</span></div>";

  const one = a => {
    const levels = !(a.levels || []).length ? "" :
      '<div class="rv-lv">' + a.levels.map(l =>
        '<div class="r"><span class="p">' + esc(l.p || "—") + "</span>"
        + '<span class="t">' + esc(l.t || "")
        + (l.n ? " <i>· " + esc(l.n) + "</i>" : "") + "</span>"
        + (l.did || l.cls
            ? '<span class="did"><span class="hit ' + esc(l.cls || "") + '">'
              + (l.cls === "ok" ? "✓" : l.cls === "no" ? "×" : l.cls === "mid" ? "~" : "")
              + "</span>" + esc(l.did || "") + "</span>"
            : "")
        + "</div>").join("") + "</div>";

    const plans = !(a.plans || []).length ? "" :
      '<div class="rv-sc">' + a.plans.map(pl =>
        '<div class="s"><span class="k">' + esc(pl.k) + "</span>"
        + '<span class="tx">' + esc(pl.tx) + "</span></div>").join("") + "</div>";

    const marks = mkMark(T.shRvMatch, a.marks && a.marks.match)
                + mkMark(T.shRvHold, a.marks && a.marks.hold);
    const side = a.side
      ? '<span class="side ' + sideTone(a.side) + '">' + esc(a.side) + "</span>" : "";
    const eve = a.eve || {};

    return '<div class="rv-a"><div class="rv-h"><span class="nm">' + esc(a.nm || "—") + "</span>"
      + side + '<span class="sp"></span>'
      + (a.net != null ? '<span class="net ' + sign(a.net) + '">' + pct(a.net) + "</span>" : "")
      + '</div><div class="rv-b">'
      + ((a.shots || []).length ? "<div>" + part("01", T.shRvCharts) + shotsHtml(a.shots) + "</div>" : "")
      + (a.why ? "<div>" + part("02", T.shRvWhere)
                 + '<div class="rv-say">' + esc(a.why) + "</div></div>" : "")
      + (levels ? "<div>" + part("03", T.shRvLevels) + levels + "</div>" : "")
      + (plans ? "<div>" + part("04", T.shRvPlans) + plans + "</div>" : "")
      + ((eve.shots || []).length || eve.text
          ? "<div>" + part("05", T.shRvEvening, true)
            + (eve.text ? '<div class="rv-say">' + esc(eve.text) + "</div>" : "")
            + shotsHtml(eve.shots) + "</div>"
          : "")
      + (marks ? '<div class="rv-marks">' + marks + "</div>" : "")
      + ((a.trades || []).length ? tradesHtml(a.trades) : "")
      + "</div></div>";
  };

  const note = (lab, tx) => !tx ? "" :
    '<div class="rv-note"><div class="lab">' + esc(lab) + "</div><p>" + esc(tx) + "</p></div>";

  return '<div class="sect">' + esc(T.shRvTitle) + "</div>"
    + '<div class="rv">' + rv.assets.map(one).join("")
    + note(T.shRvSkip, rv.skip) + note(T.shRvLesson, rv.lesson) + "</div>";
}

/* Оцінки й напрям приходять словами тією мовою, якою їх ставили, — тому
   порівнюємо зі словниками всіх мов, а не з поточним. */
function markTone(v){
  const s = String(v || "").toLowerCase();
  if (/^(так|да|yes)$/.test(s)) return "y";
  if (/^(ні|нет|no)$/.test(s)) return "n";
  return "p";
}
function sideTone(v){
  const s = String(v || "").toLowerCase();
  if (/long|лонг/.test(s)) return "long";
  if (/short|шорт/.test(s)) return "short";
  return "";
}

/* ---------- календар днів ---------- */
/* Дні лежать підряд від from до to; сітку доводимо до понеділка порожніми
   клітинками, щоб колонки збігалися з підписами тижня. */
let CAL = null, CALOPEN = null;

/* «2 сделки», а не «2 сделок»: у трьох мовах форма слова залежить від числа */
function nTrades(n){
  const f = T.shCalTradesN || ["", "", ""];
  /* в англійській форм лише дві — там другий і третій варіанти однакові */
  if (f[1] === f[2]) return n + " " + (Math.abs(n) === 1 ? f[0] : f[1]);
  const a = Math.abs(n) % 100, b = a % 10;
  const w = (a > 10 && a < 20) ? f[2] : b === 1 ? f[0] : (b > 1 && b < 5) ? f[1] : f[2];
  return n + " " + w;
}

function calHtml(cal){
  if (!cal || !(cal.days || []).length) return "";
  CAL = cal;
  const first = new Date(cal.days[0].date + "T00:00");
  const pad = (first.getDay() + 6) % 7;
  let cells = "";
  for (let i = 0; i < pad; i++) cells += '<div class="dc pad"></div>';
  cal.days.forEach(d => {
    const has = d.n > 0;
    const cls = has ? " has " + sign(d.net) : "";
    cells += '<button type="button" class="dc' + cls + (CALOPEN === d.date ? " on" : "")
      + '"' + (has ? ' data-day="' + d.date + '"' : " disabled") + ">"
      + '<span class="n">' + Number(d.date.slice(8)) + "</span>"
      + (has ? '<span class="v">' + pct(d.net) + "</span>"
             + '<span class="c">' + esc(nTrades(d.n)) + "</span>" : "")
      + "</button>";
  });
  const wd = (T.shCalWd || ["пн","вт","ср","чт","пт","сб","нд"])
    .map(w => "<span>" + esc(w) + "</span>").join("");
  const open = CALOPEN ? dayOpenHtml(cal.days.find(d => d.date === CALOPEN)) : "";
  return '<div class="sect">' + esc(T.shCalTitle) + "</div>"
    + '<p class="hintline">' + esc(T.shCalHint) + "</p>"
    + '<div class="cal ' + esc(cal.span || "") + '"><div class="wd">' + wd + "</div>"
    + '<div class="grid">' + cells + "</div></div>"
    + '<div id="dayOpen">' + open + "</div>";
}

function dayOpenHtml(d){
  if (!d) return "";
  const dt = new Date(d.date + "T00:00");
  const locale = {uk:"uk-UA", ru:"ru-RU", en:"en-US"}[LANG] || "uk-UA";
  const nice = dt.toLocaleDateString(locale, {weekday:"long", day:"numeric", month:"long"});
  return '<div class="dayopen"><div class="dh"><b>' + esc(nice) + "</b>"
    + '<span class="sub">' + esc(nTrades(d.n)) + "</span>"
    + '<span class="tot ' + sign(d.net) + '">' + pct(d.net) + "</span></div>"
    + '<div class="inner">' + tradesHtml(d.trades) + "</div></div>";
}

/* клік по дню: розкриваємо його під сіткою, повторний клік — згортаємо */
document.addEventListener("click", e => {
  const cell = e.target.closest && e.target.closest(".cal .dc[data-day]");
  if (!cell || !CAL) return;
  CALOPEN = (CALOPEN === cell.dataset.day) ? null : cell.dataset.day;
  document.querySelectorAll(".cal .dc").forEach(c =>
    c.classList.toggle("on", c.dataset.day === CALOPEN));
  const box = document.getElementById("dayOpen");
  if (box){
    box.innerHTML = CALOPEN ? dayOpenHtml(CAL.days.find(d => d.date === CALOPEN)) : "";
    if (CALOPEN) box.scrollIntoView({behavior:"smooth", block:"nearest"});
  }
  fadeSoon();
});

/* Шапка карти зі знімком і вихід із неї. Закрити карту — це не «згорнути
   вікно», а зайти в сам журнал: він і так уже стоїть позаду. */
document.getElementById("sheetMark").innerHTML = MARK;
document.getElementById("sheetWho").innerHTML = "Stats<i>AI</i>";

function toJournal(){ location.href = "/demo"; }
document.getElementById("sheetClose").onclick = toJournal;
document.getElementById("stage").addEventListener("click", e => {
  if (e.target.id === "stage") toJournal();          // клік повз карту
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.querySelector(".big")) toJournal();
});

/* Підказка «є що гортати»: край карти згасає, поки внизу лишився вміст.
   Перевіряємо після кожної події, що міняє висоту, — розгортання угоди,
   завантаження скріна, поворот телефона. */
function fade(){
  const wrap = document.querySelector(".wrap");
  const sheet = document.getElementById("sheet");
  if (!wrap || !sheet) return;
  const left = wrap.scrollHeight - wrap.clientHeight - wrap.scrollTop;
  sheet.classList.toggle("more", left > 8);
}
document.addEventListener("scroll", fade, true);   // .wrap гортається всередині
window.addEventListener("resize", fade);
/* висота міняється не миттєво: розкриття угоди анімоване, а скріни
   приходять пізніше — тому перепитуємо ще раз трохи згодом */
function fadeSoon(){ fade(); setTimeout(fade, 340); setTimeout(fade, 900); }
document.addEventListener("toggle", e => {
  if (e.target.classList && e.target.classList.contains("tr")) fadeSoon();
}, true);
document.addEventListener("load", e => {
  if (e.target.tagName === "IMG") fade();
}, true);

function shotUrl(file){
  const id = location.pathname.replace(/^\/s\//, "");
  return "/api/share/" + encodeURIComponent(id) + "/shot/" + encodeURIComponent(file);
}

/* скрін на весь екран — по кліку */
document.addEventListener("click", e => {
  const big = e.target.closest(".big");
  if (big){ big.remove(); return; }
  const fig = e.target.closest(".shots figure");
  if (!fig) return;
  const d = document.createElement("div");
  d.className = "big";
  d.innerHTML = '<img alt="" src="' + fig.dataset.src + '">';
  document.body.appendChild(d);
});

function render(rec){
  const d = rec.data || {};
  const owner = (rec.owner && rec.owner.nick) || "";
  const rows = (title, items) => !items || !items.length ? "" :
    '<div class="sect">'+esc(title)+'</div><div class="rows">'
    + items.map(r => '<div class="row"><span class="l">'+esc(r.name)+'</span>'
        + '<span class="r '+(r.value!=null?sign(r.value):"")+'">'
        + (r.text != null ? esc(r.text) : pct(r.value)) + '</span></div>').join("")
    + '</div>';

  const locale = {uk:"uk-UA", ru:"ru-RU", en:"en-US"}[LANG] || "uk-UA";
  const until = rec.expires
    ? T.shValidUntilPrefix + " " + new Date(rec.expires*1000).toLocaleString(locale,
        {day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"})
    : T.shNoLimit;

  document.getElementById("wrap").innerHTML =
      '<div class="head"><div><div class="sub">'+esc(d.kind||T.shKindDefault)+'</div>'
      + '<h1>'+esc(d.title||"")+'</h1></div>'
      + (d.total != null ? '<div class="total '+sign(d.total)+'">'+pct(d.total)+'</div>' : "")
    + '</div>'
    + (d.kpis && d.kpis.length
        ? '<div class="kpis">' + d.kpis.map(k => kpi(k.k, k.v, k.cls)).join("") + '</div>' : "")
    + tradesHtml(d.trades)
    + reviewHtml(d.review)
    + tsHtml(d.ts)
    + calHtml(d.calendar)
    + (d.blocks || []).map(b => rows(b.title, b.items)).join("")
    /* Знімок подивились — далі показуємо, звідки він. Це єдине місце,
       де людина, яка про журнал ще не чула, сама вирішує зайти. */
    + '<div class="cta"><div class="t">'
      + esc(owner ? T.pubCtaTitle.replace("%s", "@"+owner) : T.shCtaTitle)+'</div>'
      + '<p>'+esc(owner ? T.pubCtaText : T.shCtaText)+'</p>'
      /* Хазяїн знімка стоїть першим, але тільки поки його журнал
         відкритий: сервер віддає owner саме на цю мить. */
      + '<div class="btns">'
      + (owner
          ? '<a class="b" href="/u/'+esc(encodeURIComponent(owner))+'">'
            + esc(T.pubCtaAll.replace("%s", "@"+owner))+'</a>'
          : '<a class="b" href="/demo">'+esc(T.shCtaLook)+'</a>')
      + '<a class="b pri" href="/login#signup">'+esc(T.shCtaMake)+'</a></div></div>'
    + '<div class="foot"><span>'+esc(until)+'</span>'
      + '<span>'+T.shMadeIn+' <a href="/">StatsAI</a></span></div>';

  document.title = (d.title ? d.title + " · " : "") + "StatsAI";
  fadeSoon();          // знімок намальовано — тепер видно, чи все влізло
}

(async function(){
  const id = location.pathname.replace(/^\/s\//, "");
  try{
    const res = await fetch("/api/share/" + encodeURIComponent(id));
    if(res.status === 404){
      document.getElementById("wrap").innerHTML =
        '<div class="msg"><b>'+T.shLinkBroken+'</b>'
        + T.shLinkBrokenDesc + '</div>';
      return;
    }
    if(!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
  }catch(err){
    document.getElementById("wrap").innerHTML =
      '<div class="msg"><b>'+T.shOpenFailed+'</b>'+esc(err.message)+'</div>';
  }
})();

</script>
</body>
</html>
