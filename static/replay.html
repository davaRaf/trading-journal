<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Перемотка — StatsAI</title>
<!-- Без ?v= сервер віддає no-store, і правка видно одразу після
     оновлення сторінки. Версію повернемо, коли режим поїде на бій:
     там навпаки — файл має кешуватись назавжди. -->
<link rel="stylesheet" href="/static/replay.css">
</head>
<body>

<div class="rp">

  <!-- ─────────────────────────── верхня смуга ─────────────────────────── -->
  <header class="rp-top">
    <button class="sym" id="symBtn">
      <span class="sym-ico" id="symIco">€</span>
      <span id="symName">EURUSD</span>
      <svg viewBox="0 0 24 24" class="caret"><path d="M7 10l5 5 5-5"/></svg>
    </button>

    <span class="sep"></span>

    <div class="tfs" id="tfs"></div>

    <span class="sep"></span>

    <label class="src" title="Чиїми цінами малюємо">
      <select id="srcSel"></select>
    </label>

    <span class="sep"></span>

    <!-- Вхід у прогін. Стоїть окремо від смужки перемотки: цю кнопку
         тиснуть раз на початку, а смужкою користуються весь час. -->
    <button id="rwStart" class="rw-b wide" title="Обрати бар, з якого почати прогін">
      <svg viewBox="0 0 24 24"><path d="M4 5v14M20 12H9M13 8l-4 4 4 4"/></svg>
      <span>Обрати бар</span>
    </button>

    <span class="grow"></span>
    <span class="clock" id="clock"></span>
  </header>

  <!-- ───────────────────────────── тіло ───────────────────────────────── -->
  <div class="rp-body">

    <!-- ліва панель інструментів -->
    <nav class="rp-tools" id="tools">
      <button data-tool="cursor" class="on" title="Курсор">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>
      </button>
      <button data-tool="trend" title="Похила лінія">
        <svg viewBox="0 0 24 24"><path d="M4 19L20 5"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="5" r="2"/></svg>
      </button>
      <button data-tool="hline" title="Горизонтальний рівень">
        <svg viewBox="0 0 24 24"><path d="M3 12h18"/><circle cx="12" cy="12" r="2"/></svg>
      </button>
      <button data-tool="rect" title="Прямокутник">
        <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
      </button>
      <button data-tool="fib" title="Рівні Фібоначчі">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 11h18M3 16h18M3 21h18"/></svg>
      </button>
      <button data-tool="text" title="Напис">
        <svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg>
      </button>
      <span class="tsep"></span>
      <button data-act="undo" title="Прибрати останнє">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-5"/></svg>
      </button>
      <button data-act="clear" title="Стерти все">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>
      </button>
    </nav>

    <!-- графік -->
    <main class="rp-chart">
      <div class="ohlc" id="ohlc"></div>

      <div class="deal" id="deal">
        <button class="deal-b sell" id="btnSell"><b>SELL</b><i id="bidTxt">—</i></button>
        <span class="deal-sp" id="spreadTxt">—</span>
        <button class="deal-b buy" id="btnBuy"><b>BUY</b><i id="askTxt">—</i></button>
      </div>

      <!-- Смужка перемотки. Плаває над графіком і тягається за ручку:
           на TradingView вона теж не прибита до краю, бо місце під неї
           кожен обирає сам — комусь заважає ціна праворуч, комусь угоди
           внизу. Де поставили, там і лишиться: місце пам'ятається. -->
      <div class="rwbar" id="rwBar">
        <span class="rwgrip" id="rwGrip" title="Перетягніть смужку">
          <svg viewBox="0 0 24 24"><path d="M9 5h2v2H9zm4 0h2v2h-2zM9 9h2v2H9zm4 0h2v2h-2zM9 13h2v2H9zm4 0h2v2h-2zM9 17h2v2H9zm4 0h2v2h-2z"/></svg>
        </span>
        <span class="rwdiv"></span>

        <button id="rwBack" class="rw-b" title="На свічку назад (←)">
          <svg viewBox="0 0 24 24"><path d="M5 5v14M19 5l-9 7 9 7z"/></svg>
        </button>
        <button id="rwPlay" class="rw-b" title="Пуск / пауза (пробіл)">
          <svg viewBox="0 0 24 24" id="rwPlayIco"><path d="M8 5l11 7-11 7z"/></svg>
        </button>
        <button id="rwFwd" class="rw-b" title="На свічку вперед (→)">
          <svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM19 5v14"/></svg>
        </button>

        <!-- Швидкість і таймфрейм — написами, а не іконками: цифру видно
             з одного погляду, а іконка однаково вимагала б підпису. -->
        <button id="rwSpeed" class="rw-t" title="Швидкість самоходу">1×</button>
        <button id="rwTf" class="rw-t" title="Крок дорівнює одній свічці цього таймфрейму">15m</button>

        <span class="rwdiv"></span>
        <button id="rwStop" class="rw-b" title="До останньої свічки — вийти з прогону">
          <svg viewBox="0 0 24 24"><path d="M4 5l9 7-9 7zM17 5v14M21 5v14"/></svg>
        </button>

        <div class="rwpop" id="rwPopSpeed"></div>
        <div class="rwpop" id="rwPopTf"></div>
      </div>

      <div id="chart"></div>
      <canvas id="draw"></canvas>

      <div class="hint" id="hint" hidden></div>
      <div class="tip" id="tip" hidden></div>
    </main>

    <!-- права панель -->
    <aside class="rp-side">
      <div class="side-h">
        <span>Список</span>
        <button class="add" id="wlAdd" title="Додати інструмент">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="wl" id="wl"></div>

      <div class="side-h pos-h">
        <span>Угоди прогону</span>
        <b id="pnlSum">0,0</b>
      </div>
      <div class="pos" id="pos"></div>
    </aside>
  </div>
</div>

<!-- Смужка властивостей виділеної фігури. Живе поверх усього й тягається
     за ручку в будь-який кут: місце над графіком дороге, і кожному
     зручний свій. -->
<div class="props" id="props" hidden>
  <span class="grip" id="grip" title="Перетягніть">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>
  </span>

  <button class="ptrig" data-pop="stroke" title="Колір лінії">
    <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10a2.1 2.1 0 00-3-3L5 16z"/></svg>
    <i class="bar" id="barStroke"></i>
  </button>
  <button class="ptrig" data-pop="text" title="Колір напису">
    <svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg>
    <i class="bar" id="barText"></i>
  </button>

  <span class="pdiv"></span>

  <button class="ptrig wide" data-pop="width" title="Товщина лінії">
    <svg viewBox="0 0 24 24"><path d="M4 12h16" id="icoW"/></svg>
    <b id="wLabel">1px</b>
  </button>
  <button class="ptrig" data-pop="dash" title="Стиль лінії">
    <svg viewBox="0 0 24 24" id="icoD"><path d="M3 12h18"/></svg>
  </button>

  <span class="pdiv"></span>

  <button class="pbtn" id="pText" title="Напис на фігурі">
    <svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg>
  </button>
  <button class="pbtn danger" id="pDel" title="Видалити фігуру">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>
  </button>

  <!-- шторки: кожна розкривається під своєю кнопкою -->
  <div class="pop pal" id="popStroke" data-for="color"></div>
  <div class="pop pal" id="popText" data-for="textColor"></div>

  <div class="pop" id="popWidth">
    <div class="rows" id="wRows"></div>
  </div>

  <div class="pop" id="popDash">
    <div class="rows">
      <button data-d="0"><svg viewBox="0 0 40 8"><path d="M2 4h36"/></svg><span>Суцільна</span></button>
      <button data-d="9"><svg viewBox="0 0 40 8"><path d="M2 4h8M15 4h8M28 4h8"/></svg><span>Пунктир</span></button>
      <button data-d="2"><svg viewBox="0 0 40 8"><path d="M2 4h2M8 4h2M14 4h2M20 4h2M26 4h2M32 4h2"/></svg><span>Крапками</span></button>
    </div>
  </div>
</div>

<!-- вікно вибору інструмента -->
<div class="modal" id="symModal" hidden>
  <div class="modal-in">
    <input id="symQ" placeholder="Пошук інструмента" autocomplete="off">
    <div class="sym-list" id="symList"></div>
  </div>
</div>

<!-- вікно ордера -->
<div class="modal" id="ordModal" hidden>
  <div class="modal-in narrow">
    <h3 id="ordTitle">Купівля</h3>
    <label>Обсяг, лотів<input type="number" id="ordLot" value="1" step="0.01" min="0.01"></label>
    <label>Стоп-лос, пунктів<input type="number" id="ordSl" value="100" step="1" min="0"></label>
    <label>Тейк-профіт, пунктів<input type="number" id="ordTp" value="200" step="1" min="0"></label>
    <p class="note" id="ordNote"></p>
    <div class="modal-btns">
      <button class="ghost" id="ordCancel">Скасувати</button>
      <button class="prim" id="ordGo">Відкрити</button>
    </div>
  </div>
</div>

<script src="/static/vendor/lightweight-charts.js"></script>
<script src="/static/replay.js"></script>
</body>
</html>
