<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StatsAI · тариф в плашке профиля</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   Пробник: как показывать тариф в плашке профиля вверху справа.
   Без нажима: тариф — тихая подпись, а не кнопка «купи».
   Цвета — тёмная «Ночь» и светлый «День» из static/themes.js.
   ============================================================ */
:root{--sans:"Geist","Segoe UI",system-ui,sans-serif;--mono:"Geist Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#f2f2f3;font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 80px}
h1{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
.lead{margin:0 0 16px;color:#8f8f95;font-size:13.5px;max-width:680px}
.v{border:1px solid rgba(255,255,255,.08);border-radius:16px;background:#0b0b0c;padding:16px 18px;margin-bottom:14px}
.v h2{margin:0 0 3px;font-size:15px}
.v p{margin:0 0 12px;color:#8f8f95;font-size:12.5px}
.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:820px){.rows{grid-template-columns:1fr}}

/* ---- тема ---- */
.th{--bg:#050505;--panel:#0d0d0e;--panel2:#141416;--line:rgba(255,255,255,.08);--text:#f2f2f3;--dim:#8c8c90;--faint:#5c5c61;--acc:#40e094;--accink:#06130d;
  background:var(--bg);color:var(--text);border-radius:12px;padding:12px 12px 10px;border:1px solid var(--line)}
.th.light{--bg:#f2f4f8;--panel:#ffffff;--panel2:#f6f8fb;--line:#dde3ec;--text:#171b24;--dim:#5a6373;--faint:#99a2b3;--acc:#2b62e3;--accink:#fff}
.cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.states{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.bar .lbl{margin-right:auto;font-size:11.5px;color:var(--faint)}
.seg{display:flex;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:11.5px}
.seg span{padding:4px 9px;border-radius:7px;color:var(--dim)}
.seg span.on{background:var(--panel2);color:var(--text)}

/* плашка профиля */
.me{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;min-height:40px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);position:relative;cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;position:relative;
  background:color-mix(in srgb,var(--acc) 18%,var(--panel));color:var(--acc)}
.who{display:flex;flex-direction:column;line-height:1.2}
.who b{font-size:13px}
.who small{font-size:11px;color:var(--faint)}

/* A — как сейчас */
.tagA{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--faint);padding:2px 5px;border-radius:5px}
/* C — кольцо */
.ringC{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--acc)}
.ringC.life{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--acc),0 0 0 5.5px var(--panel),0 0 0 6.5px color-mix(in srgb,var(--acc) 55%,transparent)}
/* D — значок в углу аватарки */
.dotD{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:var(--acc);color:var(--accink);
  display:grid;place-items:center;font-size:8px;border:2px solid var(--panel);line-height:1}
/* E — счётчик лимита */
.meterE{display:flex;align-items:center;gap:6px}
.meterE i{display:block;width:34px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.meterE i b{display:block;height:100%;background:var(--faint)}
/* F — только в меню */
.pop{position:absolute;right:0;top:calc(100% + 6px);width:220px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  padding:10px;box-shadow:0 18px 40px -18px rgba(0,0,0,.6);z-index:2;text-align:left}
.pop .ln{display:flex;justify-content:space-between;font-size:12px;padding:5px 4px;color:var(--dim)}
.pop .ln b{color:var(--text);font-weight:500}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.pop a{display:block;font-size:12px;color:var(--dim);padding:5px 4px;text-decoration:none}
.bar.f{min-height:176px;align-items:flex-start}
</style>
</head>
<body>
<div class="wrap">
  <h1>Тариф в плашке профиля · пробник</h1>
  <p class="lead">Шесть вариантов, как показать тариф рядом с аватаркой вверху справа. Везде без нажима: тариф — тихая подпись, а не кнопка «купи». В каждом варианте одни и те же состояния: бесплатный, месяц, год, навсегда (основатели). Слева тёмная тема, справа светлая.</p>
  <div id="out"></div>
</div>
<script>
const STATES=[
  {k:"free",lbl:"Бесплатный · 12 из 20 сделок"},
  {k:"m",lbl:"Подписка на месяц"},
  {k:"y",lbl:"Подписка на год"},
  {k:"life",lbl:"Навсегда · основатель"},
];
const seg=`<span class="seg"><span class="on">Реальные</span><span>Бэктест</span></span>`;
const av=(extra="",inner="")=>`<span class="av ${extra}">D${inner}</span>`;
const VARIANTS=[
  {t:"А · Как сейчас",d:"Короткая метка перед аватаркой: FREE, 1М, 12М, ∞. Уже сделано у Данилы, для сравнения.",
   me:s=>`<span class="tagA">${{free:"FREE",m:"1М",y:"12М",life:"∞"}[s.k]}</span>${av()}<span class="who"><b>demo</b><small>Профиль</small></span>`},
  {t:"Б · Подпись вместо «Профиль»",d:"Под ником вместо слова «Профиль» — тариф обычным текстом. Ничего лишнего в строке.",
   me:s=>`${av()}<span class="who"><b>demo</b><small>${{free:"Бесплатный",m:"Pro · месяц",y:"Pro · год",life:"Pro · навсегда"}[s.k]}</small></span>`},
  {t:"В · Кольцо вокруг аватарки",d:"Бесплатный — без кольца. Подписка — тонкое кольцо цветом темы, навсегда — двойное. Слов нет, смысл по наведению.",
   me:s=>`${av(s.k==="free"?"":s.k==="life"?"ringC life":"ringC")}<span class="who"><b>demo</b><small>Профиль</small></span>`},
  {t:"Г · Значок на аватарке",d:"Как статус в мессенджере: маленький значок в углу аватарки только у подписки. У бесплатного — ничего.",
   me:s=>`${av("",s.k==="free"?"":`<span class="dotD">${s.k==="life"?"∞":"✦"}</span>`)}<span class="who"><b>demo</b><small>Профиль</small></span>`},
  {t:"Д · Тихий счётчик лимита",d:"Бесплатному полезно видеть остаток: тонкая полоска и «12/30» под ником. У подписки — просто «Pro».",
   me:s=>`${av()}<span class="who"><b>demo</b>${s.k==="free"?`<small class="meterE"><i><b style="width:40%"></b></i>12/30</small>`:`<small>Pro</small>`}</span>`},
  {t:"Е · Только в меню профиля",d:"В строке ничего не меняется. Тариф, остаток и продление видны, только когда нажал на профиль.",
   me:s=>`${av()}<span class="who"><b>demo</b><small>Профиль</small></span>`, pop:true},
];
const pops={free:[["Тариф","Бесплатный"],["Сделок","12 из 20"]],m:[["Тариф","Pro · месяц"],["Продление","28 октября"]],
  y:[["Тариф","Pro · год"],["Продление","28.09.2027"]],life:[["Тариф","Pro · навсегда"],["С нами","с сентября 2026"]]};
function block(v,light){
  return `<div class="th${light?" light":""}"><div class="cap">${light?"Светлая":"Тёмная"}</div><div class="states">`
   + STATES.map((s,i)=>`<div class="bar${v.pop&&i===0?" f":""}"><span class="lbl">${s.lbl}</span>${seg}<span class="me">${v.me(s)}`
     + (v.pop&&i===0?`<span class="pop">${pops.free.map(([a,b])=>`<div class="ln"><span>${a}</span><b>${b}</b></div>`).join("")}<hr><a>Настройки</a><a>Подписка</a></span>`:"")
     + `</span></div>`).join("")
   + `</div></div>`;
}
document.getElementById("out").innerHTML=VARIANTS.map(v=>
  `<div class="v"><h2>${v.t}</h2><p>${v.d}</p><div class="rows">${block(v,false)}${block(v,true)}</div></div>`).join("");
</script>
</body>
</html>
