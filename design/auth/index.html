/* ============================================================
   Экран входа StatsAI.
   Четыре фоновые анимации × четыре палитры — всё рисуется кодом.
   Цвета анимации берутся из этих же CSS-переменных, так что
   смена палитры перекрашивает и фон, и форму разом.
   ============================================================ */

:root{
  --sans:"Geist","Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}

/* ---- 1. Ночь: почти чёрный, как в макете журнала ---- */
:root[data-pal="night"]{
  --canvas:5,5,5;
  --surface:#0d0d0e;   --surface-2:#111112;  --surface-3:#161617;
  --hair:rgba(255,255,255,.08);  --hair-soft:rgba(255,255,255,.045);
  --text:#f2f2f3;  --dim:#8c8c90;  --faint:#5c5c61;
  --pos-rgb:64,224,148;  --neg-rgb:255,110,96;  --grid-rgb:255,255,255;
  --btn-bg:#f2f2f3;  --btn-fg:#0d0d0e;
  --veil-mid:.92; --veil-edge:.72;
  --amp:2.6; --glow:1;   --on-accent:#06130d;
}

/* ---- 2. Сумерки: глубокий сине-зелёный. Тёмный, но не чёрный ---- */
:root[data-pal="dusk"]{
  --canvas:16,26,30;
  --surface:#18262b;   --surface-2:#1d2d33;  --surface-3:#23353c;
  --hair:rgba(190,225,225,.11);  --hair-soft:rgba(190,225,225,.06);
  --text:#e8f0f0;  --dim:#96aaad;  --faint:#69807f;
  --pos-rgb:120,206,164;  --neg-rgb:214,140,122;  --grid-rgb:200,235,235;
  --btn-bg:#e8f0f0;  --btn-fg:#16242a;
  --veil-mid:.90; --veil-edge:.66;
  --amp:1.7; --glow:.55; --on-accent:#08150f;
}

/* ---- 3. Дымка: средний серо-голубой, заметно светлее ---- */
:root[data-pal="haze"]{
  --canvas:42,50,56;
  --surface:#39434a;   --surface-2:#414c54;  --surface-3:#4b5760;
  --hair:rgba(255,255,255,.13);  --hair-soft:rgba(255,255,255,.07);
  --text:#f0f3f5;  --dim:#b3bcc4;  --faint:#8b959d;
  --pos-rgb:150,196,168;  --neg-rgb:206,158,144;  --grid-rgb:255,255,255;
  --btn-bg:#f2f5f7;  --btn-fg:#2a3238;
  --veil-mid:.86; --veil-edge:.58;
  --amp:1.2; --glow:.25; --on-accent:#0b1a12;
}

/* ---- 4. Утро: светлая тема, карточка тоже светлая ---- */
:root[data-pal="morning"]{
  --canvas:238,238,234;
  --surface:#ffffff;   --surface-2:#f4f4f1;  --surface-3:#dbdfd9;
  --hair:rgba(30,35,35,.13);  --hair-soft:rgba(30,35,35,.07);
  --text:#1b2220;  --dim:#5f6a67;  --faint:#8b948f;
  --pos-rgb:74,128,99;  --neg-rgb:166,94,78;  --grid-rgb:40,50,48;
  --btn-bg:#1b2220;  --btn-fg:#f4f4f1;
  --veil-mid:.80; --veil-edge:.46;
  --amp:2.3; --glow:0;   --on-accent:#f4f7f4;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:rgb(var(--canvas)); color:var(--text);
  font-family:var(--sans); -webkit-font-smoothing:antialiased; overflow:hidden;
  transition:background .5s var(--ease), color .5s var(--ease);
}

#bg{position:fixed; inset:0; width:100%; height:100%; display:block}

/* затемнение к центру, чтобы форма читалась поверх любого фона */
.veil{
  position:fixed; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse 46% 52% at 50% 50%,
      rgba(var(--canvas),var(--veil-mid)) 0%,
      rgba(var(--canvas),var(--veil-edge)) 45%,
      rgba(var(--canvas),0) 78%),
    linear-gradient(to bottom,
      rgba(var(--canvas),.5) 0%, rgba(var(--canvas),0) 22%,
      rgba(var(--canvas),0) 76%, rgba(var(--canvas),.66) 100%);
  transition:background .5s var(--ease);
}

/* ---------- карточка ---------- */
.stage{
  position:relative; height:100%; overflow-y:auto;
  display:flex; flex-direction:column; align-items:center;
  justify-content:center;
  justify-content:safe center;   /* при нехватке места не срезает верх */
  gap:clamp(20px,3.4vh,34px); padding:40px 24px;
  transition:padding-bottom .35s var(--ease);
}
.card{
  position:relative; width:100%; max-width:380px;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  border:1px solid var(--hair); border-radius:14px;
  padding:34px 32px 28px;
  backdrop-filter:blur(14px) saturate(115%);
  box-shadow:0 40px 90px -22px rgba(0,0,0,.55);
  transition:background .5s var(--ease), border-color .5s var(--ease);
}
.brand{display:flex; align-items:baseline; gap:9px; margin-bottom:26px}
/* знак вытянут по вертикали из-за фитилей — размер задаём по высоте */
.brand .logo{height:30px; width:auto; aspect-ratio:902/1315; display:block;
  color:var(--text); flex:0 0 auto}
.brand .mark{font-family:var(--mono); font-size:19px; font-weight:500; letter-spacing:-.02em}
.brand .mark i{font-style:normal; color:rgb(var(--pos-rgb))}
.brand .sub{font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint)}

.tabs{display:flex; gap:2px; padding:3px; background:var(--surface-2);
  border:1px solid var(--hair-soft); border-radius:9px; margin-bottom:22px}
.tabs button{
  flex:1; border:0; background:transparent; color:var(--dim); font:inherit;
  font-size:13px; padding:8px 0; border-radius:7px; cursor:pointer;
  transition:background .25s var(--ease), color .25s var(--ease);
}
.tabs button.on{background:var(--surface-3); color:var(--text); box-shadow:inset 0 0 0 1px var(--hair)}
.tabs button:focus-visible{outline:1px solid rgb(var(--pos-rgb)); outline-offset:1px}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.field[hidden]{display:none}
.field label{font-family:var(--mono); font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint)}
.field input{
  background:var(--surface-2); border:1px solid var(--hair-soft); border-radius:9px;
  padding:11px 13px; color:var(--text); font:inherit; font-size:14px;
  transition:border-color .2s var(--ease), background .5s var(--ease);
}
.field input::placeholder{color:var(--faint)}
.field input:focus{outline:none; border-color:rgb(var(--pos-rgb))}

.go{
  width:100%; margin-top:8px; padding:12px 0; border:0; border-radius:9px;
  background:var(--btn-bg); color:var(--btn-fg); font:inherit; font-size:14px;
  font-weight:500; cursor:pointer; transition:opacity .2s var(--ease);
}
.go:hover{opacity:.88}
.go:focus-visible{outline:2px solid rgb(var(--pos-rgb)); outline-offset:2px}

.alt{margin-top:16px; text-align:center; font-size:12.5px; color:var(--faint)}
.alt a{color:var(--dim); text-decoration:none; border-bottom:1px solid var(--hair)}
.alt a:hover{color:var(--text)}

/* ---------- кнопка: покой → загрузка → успех ---------- */
.go{position:relative; overflow:hidden}
.go .lbl{transition:opacity .2s var(--ease), transform .25s var(--ease); display:inline-block}
.go .spin, .go .tick{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.7);
  opacity:0; transition:opacity .2s var(--ease), transform .3s var(--ease);
}
.go .spin{
  width:16px; height:16px; border-radius:50%;
  border:2px solid color-mix(in srgb, var(--on-accent) 30%, transparent);
  border-top-color:var(--on-accent);
}
.go .tick{width:22px; height:22px; fill:none; stroke:var(--on-accent);
  stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.go .tick path{stroke-dasharray:26; stroke-dashoffset:26}

.go.busy .lbl{opacity:0; transform:translateY(-6px)}
.go.busy .spin{opacity:1; transform:translate(-50%,-50%) scale(1); animation:spin .7s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) scale(1) rotate(360deg)}}

.go.done .lbl{opacity:0; transform:translateY(-6px)}
.go.done .tick{opacity:1; transform:translate(-50%,-50%) scale(1)}
.go.done .tick path{animation:draw .45s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- тряска при ошибке ---------- */
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}
.shell.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
.field.bad input{border-color:rgb(var(--neg-rgb))}
.field.bad label{color:rgb(var(--neg-rgb))}

/* ---------- плавная смена вкладок ---------- */
.card form, .card .social, .card .or, .card .alt{
  transition:opacity .22s var(--ease), transform .22s var(--ease);
}
.card.swap form, .card.swap .social, .card.swap .or, .card.swap .alt{
  opacity:0; transform:translateY(6px);
}

/* ---------- лёгкий наклон за курсором ---------- */
.stage{perspective:1100px}
.shell{transform-style:preserve-3d; will-change:transform}
/* параллакс: чем дальше слой, тем меньше он смещается */
#bg{will-change:transform}
.headline{will-change:transform}

/* ---------- переключатель языка ---------- */
.langs{
  position:fixed; top:20px; right:22px; z-index:6;
  display:flex; gap:2px; padding:3px; border-radius:9px;
  background:color-mix(in srgb, var(--surface) 82%, transparent);
  border:1px solid var(--hair); backdrop-filter:blur(12px);
}
.langs button{
  border:0; background:transparent; color:var(--faint); cursor:pointer;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  padding:5px 9px; border-radius:6px;
  transition:background .2s var(--ease), color .2s var(--ease);
}
.langs button:hover{color:var(--dim)}
.langs button.on{background:var(--surface-3); color:var(--text)}
.langs button:focus-visible{outline:1px solid rgb(var(--pos-rgb)); outline-offset:1px}
@media (max-width:520px){ .langs{top:14px; right:14px} }

/* ---------- надпись над панелью ---------- */
.headline{
  margin:0; max-width:min(560px, 88vw); text-align:center;
  font-family:"PT Serif", Georgia, serif;
  font-size:clamp(18px,2.4vw,23px);
  font-weight:400; font-style:italic; line-height:1.45;
  letter-spacing:-.015em; color:var(--text); text-wrap:balance;
  opacity:.92;
  animation:riseIn .8s var(--ease) both;
}
.headline::before{content:"«"; color:var(--faint); margin-right:.05em}
.headline::after{content:"»"; color:var(--faint); margin-left:.02em}
.headline:empty{display:none}
.headline:empty::before,.headline:empty::after{content:none}
.headline b{color:rgb(var(--pos-rgb)); font-weight:500}

@keyframes riseIn{ from{opacity:0; transform:translateY(14px)} to{opacity:.92; transform:none} }
@keyframes cardIn{ from{opacity:0; transform:translateY(20px) scale(.985)} to{opacity:1; transform:none} }
.shell{animation:cardIn .75s var(--ease) both .08s}

/* ---------- вход через сервисы ---------- */
.social{display:flex; flex-direction:column; gap:8px; margin-bottom:18px}
.soc{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; padding:11px 0; border-radius:9px; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--hair);
  color:var(--text); font:inherit; font-size:13.5px;
  transition:background .2s var(--ease), border-color .2s var(--ease), transform .12s var(--ease);
}
.soc:hover{background:var(--surface-3); border-color:rgba(var(--pos-rgb),.4)}
.soc:active{transform:translateY(1px)}
.soc:focus-visible{outline:2px solid rgb(var(--pos-rgb)); outline-offset:2px}
.soc svg{width:17px; height:17px; flex:0 0 auto}

.or{display:flex; align-items:center; gap:12px; margin-bottom:18px}
.or::before,.or::after{content:""; flex:1; height:1px; background:var(--hair)}
.or span{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint);
}

/* ---------- пароль: показать/скрыть ---------- */
.pwwrap{position:relative; display:flex}
.pwwrap input{flex:1; padding-right:40px}
.eye{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; display:grid; place-items:center;
  border:0; background:transparent; color:var(--faint); cursor:pointer;
  border-radius:6px; transition:color .2s var(--ease);
}
.eye svg{width:17px; height:17px; fill:currentColor}
.eye:hover{color:var(--text)}
.eye.off svg{opacity:.45}
.eye:focus-visible{outline:1px solid rgb(var(--pos-rgb)); outline-offset:1px}

/* ---------- надёжность пароля ---------- */
.meter{display:flex; align-items:center; gap:5px; margin-top:8px}
.meter[hidden]{display:none}
.meter i{
  flex:1; height:3px; border-radius:2px; background:var(--hair);
  transition:background .3s var(--ease);
}
.meter span{
  font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--faint); margin-left:4px; min-width:52px;
}
.meter[data-lvl="1"] i:nth-child(-n+1){background:rgb(var(--neg-rgb))}
.meter[data-lvl="2"] i:nth-child(-n+2){background:#d7a13c}
.meter[data-lvl="3"] i:nth-child(-n+3){background:#d7a13c}
.meter[data-lvl="4"] i{background:rgb(var(--pos-rgb))}

/* ---------- запомнить меня / забыли пароль ---------- */
.minor{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; margin:4px 0 16px; font-size:12.5px;
}
.check{display:flex; align-items:center; gap:8px; color:var(--dim); cursor:pointer}
.check input{
  appearance:none; width:15px; height:15px; border-radius:4px; cursor:pointer;
  border:1px solid var(--hair); background:var(--surface-2); display:grid; place-items:center;
  transition:background .2s var(--ease), border-color .2s var(--ease);
}
.check input:checked{background:rgb(var(--pos-rgb)); border-color:rgb(var(--pos-rgb))}
.check input:checked::after{
  content:""; width:8px; height:4px; border-left:1.6px solid var(--on-accent);
  border-bottom:1.6px solid var(--on-accent); transform:rotate(-45deg) translate(1px,-1px);
}
.check input:focus-visible{outline:2px solid rgb(var(--pos-rgb)); outline-offset:2px}
.minor a{color:var(--dim); text-decoration:none; border-bottom:1px solid var(--hair)}
.minor a:hover{color:var(--text)}

/* кнопка входа мягко светится на наведении */
.go{position:relative}
:root[data-card="accent"] .go:hover{box-shadow:0 0 26px -4px rgba(var(--pos-rgb),.65)}

/* ============ варианты оформления панели ============ */
.shell{width:100%; display:flex; justify-content:center}
.pitch{display:none}

/* --- 2. Разделённый экран --- */
:root[data-card="split"] .shell{
  max-width:880px; border:1px solid var(--hair); border-radius:16px; overflow:hidden;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(16px) saturate(115%);
  box-shadow:0 50px 100px -30px rgba(0,0,0,.6);
}
:root[data-card="split"] .pitch{
  display:flex; flex-direction:column; justify-content:space-between; gap:28px;
  flex:1 1 46%; padding:38px 34px; border-right:1px solid var(--hair-soft);
  background:linear-gradient(155deg, rgba(var(--pos-rgb),.10), transparent 62%);
}
:root[data-card="split"] .card{
  flex:1 1 54%; max-width:none; background:transparent; border:0;
  border-radius:0; box-shadow:none; backdrop-filter:none; padding:38px 34px;
}
/* логотип здесь уже есть слева — во второй раз не повторяем */
:root[data-card="split"] .card > .brand{display:none}
:root[data-card="split"] .card .tabs{margin-top:4px}
@media (max-width:760px){
  :root[data-card="split"] .pitch{display:none}
  :root[data-card="split"] .shell{max-width:400px}
}
.pitch .big{font-size:23px; font-weight:600; line-height:1.28; letter-spacing:-.02em}
.pitch .facts{display:flex; flex-direction:column; gap:13px}
.pitch .fact{display:flex; flex-direction:column; gap:2px}
.pitch .fact b{font-family:var(--mono); font-size:17px; font-weight:500;
  color:rgb(var(--pos-rgb)); letter-spacing:-.01em}
.pitch .fact span{font-size:12px; color:var(--dim)}

/* --- 3. Без карточки --- */
:root[data-card="bare"] .card{
  background:transparent; border:0; box-shadow:none; backdrop-filter:none;
  max-width:330px; padding:0;
}
:root[data-card="bare"] .brand{justify-content:center; margin-bottom:32px}
:root[data-card="bare"] .tabs{background:transparent; border:0; padding:0;
  gap:22px; justify-content:center; margin-bottom:26px}
:root[data-card="bare"] .tabs button{flex:0 0 auto; padding:6px 0; border-radius:0}
:root[data-card="bare"] .tabs button.on{background:transparent; box-shadow:none;
  border-bottom:1px solid rgb(var(--pos-rgb))}
:root[data-card="bare"] .field input{
  background:transparent; border:0; border-bottom:1px solid var(--hair);
  border-radius:0; padding:10px 2px;
}
:root[data-card="bare"] .field input:focus{border-bottom-color:rgb(var(--pos-rgb))}
:root[data-card="bare"] .field{margin-bottom:18px}
:root[data-card="bare"] .soc{background:transparent}
:root[data-card="bare"] .soc:hover{background:color-mix(in srgb, var(--surface) 55%, transparent)}

/* --- 4. Терминал --- */
:root[data-card="frame"] .card{
  border-radius:2px; padding:32px 30px;
  background:color-mix(in srgb, var(--surface) 94%, transparent);
}
:root[data-card="frame"] .card::before{
  content:""; position:absolute; inset:5px; border:1px solid var(--hair-soft);
  pointer-events:none;
}
:root[data-card="frame"] .card *{font-family:var(--mono)}
:root[data-card="frame"] .tabs,
:root[data-card="frame"] .field input{border-radius:2px}
:root[data-card="frame"] .tabs button{border-radius:0; font-size:12px;
  letter-spacing:.06em; text-transform:uppercase}
:root[data-card="frame"] .go{border-radius:2px; font-size:12px;
  letter-spacing:.12em; text-transform:uppercase}

/* --- 5. Акцент --- */
:root[data-card="accent"] .card{padding-top:42px; overflow:hidden}
:root[data-card="accent"] .card::before{
  content:""; position:absolute; left:0; right:0; top:0; height:2px;
  background:linear-gradient(90deg, transparent, rgb(var(--pos-rgb)), transparent);
}
:root[data-card="accent"] .card::after{
  content:""; position:absolute; left:50%; top:0; width:240px; height:120px;
  transform:translateX(-50%); pointer-events:none;
  background:radial-gradient(ellipse at top, rgba(var(--pos-rgb),.22), transparent 70%);
}
:root[data-card="accent"] .brand{flex-direction:column; align-items:center;
  gap:5px; margin-bottom:26px}
:root[data-card="accent"] .brand .logo{height:54px; margin-bottom:4px}
:root[data-card="accent"] .brand .mark{font-size:25px}
:root[data-card="accent"] .go{background:rgb(var(--pos-rgb)); color:var(--on-accent);
  font-weight:600; padding:13px 0}

<script>
const cv = document.getElementById("bg");
const ctx = cv.getContext("2d");
/* Движение включено по умолчанию, даже если в системе выключены анимации:
   без него не видно самого смысла экрана. Переключатель — ниже. */
let MOTION = true;
const CALM_SYS = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* цвета анимации читаются из палитры — одна точка правды */
let C = {};
function readPalette(){
  const cs = getComputedStyle(document.documentElement);
  C = {
    pos:  cs.getPropertyValue("--pos-rgb").trim(),
    neg:  cs.getPropertyValue("--neg-rgb").trim(),
    grid: cs.getPropertyValue("--grid-rgb").trim(),
    base: cs.getPropertyValue("--canvas").trim(),
  };
}

/* K — плотность линий, GLOW — сила свечения. Задаются палитрой. */
let K = 1, GLOW = 0;
function readTone(){
  const cs = getComputedStyle(document.documentElement);
  K    = parseFloat(cs.getPropertyValue("--amp"))  || 1;
  GLOW = parseFloat(cs.getPropertyValue("--glow")) || 0;
}

let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!W || !H) return;
  if (current) current.init();
}
addEventListener("resize", resize);

function walk(n, start, vol){
  const out = []; let p = start;
  for (let i = 0; i < n; i++){ p += (Math.random() - 0.485) * vol; out.push(p); }
  return out;
}

/* ============ 1. Свечи ============ */
/* Каждая свеча рождается с нулевой высотой и вырастает из цены открытия
   в обе стороны — так, как она формируется на реальном графике.
   Пока свеча молодая, она подсвечена; свечение гаснет вместе с ростом. */
const candles = {
  name: "Свечи",
  note: "Свечи рождаются у правого края и вырастают на глазах",
  GROW: 0.75,          // секунд на полный рост одной свечи
  init(){
    this.cw = this.SIZES[this.size].cw;
    this.gap = this.SIZES[this.size].gap;
    this.n = Math.ceil(W / (this.cw + this.gap)) + 3;
    this.bars = []; this.price = 100;
    for (let i = 0; i < this.n; i++){
      const b = this.make();
      // при открытии график собирается слева направо;
      // если у человека выключены анимации — показываем сразу готовый
      b.wait = MOTION ? i * 0.030 : 0;
      b.age  = MOTION ? 0 : 1;
      this.bars.push(b);
    }
    this.off = 0;
  },
  SIZES: [ {cw:14, gap:6, drift:0.40, noise:3.4},     // обычные
           {cw:23, gap:9, drift:0.62, noise:3.2},     // крупные
           {cw:34, gap:13, drift:0.90, noise:3.0} ],  // очень крупные
  size: 1,             // по умолчанию крупные
  get DRIFT(){ return this.SIZES[this.size].drift },
  get NOISE(){ return this.SIZES[this.size].noise },
  make(){
    const open = this.price;
    const close = open + this.DRIFT + (Math.random() - 0.5) * this.NOISE;
    const hi = Math.max(open, close) + Math.random() * 2.0;
    const lo = Math.min(open, close) - Math.random() * 2.0;
    this.price = close;
    return { open, close, hi, lo, age: 0, wait: 0 };
  },
  draw(dt){
    // за candleEvery секунд график сдвигается ровно на одну свечу
    this.off += dt * ((this.cw + this.gap) / SETUP.candleEvery);
    while (this.off > this.cw + this.gap){
      this.off -= this.cw + this.gap;
      this.bars.shift(); this.bars.push(this.make());
    }
    for (const b of this.bars){
      if (b.wait > 0){ b.wait -= dt; continue; }
      b.age = Math.min(1, b.age + dt / this.GROW);
    }

    /* Масштаб по вертикали. Раньше он считался заново каждый кадр по крайним
       значениям видимых свечей — и когда высокая свеча уходила за левый край,
       границы менялись скачком и весь график дёргался. Теперь границы
       подтягиваются к цели плавно. */
    let tMn = Infinity, tMx = -Infinity;
    for (const b of this.bars){ if (b.lo < tMn) tMn = b.lo; if (b.hi > tMx) tMx = b.hi; }
    if (this.mn === undefined){ this.mn = tMn; this.mx = tMx; }
    const k = Math.min(1, dt * 2.2);
    this.mn += (tMn - this.mn) * k;
    this.mx += (tMx - this.mx) * k;

    const pad = (this.mx - this.mn) * 0.28 || 1;
    const mn = this.mn - pad, mx = this.mx + pad;
    const y = v => H - ((v - mn) / (mx - mn)) * H;
    const ease = t => 1 - Math.pow(1 - t, 3);

    for (let i = 0; i < this.bars.length; i++){
      const b = this.bars[i];
      if (b.wait > 0 || b.age <= 0) continue;

      const e = ease(b.age);
      /* Позиция округляется до пикселя. Пока она была дробной, тонкая обводка
         каждый кадр попадала между пикселями и края свечей мерцали. */
      const x = Math.round(i * (this.cw + this.gap) - this.off);
      const up = b.close >= b.open;
      const col = up ? C.pos : C.neg;

      // ярче в середине экрана, тише к краям
      const dx = Math.abs(x + this.cw / 2 - W / 2) / (W / 2);
      const a = (0.13 + 0.20 * (1 - dx)) * K;

      // свежая свеча светится, свечение гаснет по мере роста
      const fresh = 1 - b.age;
      if (GLOW > 0 && fresh > 0){
        ctx.shadowBlur = 16 * GLOW * fresh;
        ctx.shadowColor = `rgba(${col},${Math.min(1, a * 2.2)})`;
      }

      // тень и тело растут из цены открытия
      const vHi = b.open + (b.hi - b.open) * e;
      const vLo = b.open + (b.lo - b.open) * e;
      const vCl = b.open + (b.close - b.open) * e;

      const lw = Math.max(1.2, this.cw * 0.085);
      // середина фитиля кладётся на полпикселя — так линия остаётся чёткой
      const xw = Math.round(x + this.cw / 2) + (Math.round(lw) % 2 ? .5 : 0);
      ctx.strokeStyle = `rgba(${col},${Math.min(1, a * 0.9)})`;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(xw, Math.round(y(vHi)));
      ctx.lineTo(xw, Math.round(y(vLo)));
      ctx.stroke();

      const yo = Math.round(y(b.open)), yc = Math.round(y(vCl));
      const top = Math.min(yo, yc);
      const h = Math.max(1.4, Math.abs(yc - yo));
      if (up){
        ctx.fillStyle = `rgba(${col},${Math.min(1, a * 0.34)})`;
        ctx.fillRect(x, top, this.cw, h);
        ctx.strokeStyle = `rgba(${col},${Math.min(1, a * 1.15)})`;
        ctx.strokeRect(x + .5, top + .5, this.cw - 1, h - 1);
      } else {
        ctx.fillStyle = `rgba(${col},${Math.min(1, a)})`;
        ctx.fillRect(x, top, this.cw, h);
      }
      ctx.shadowBlur = 0;
    }
  }
};

/* ============ 2. Эквити ============ */
const equity = {
  name: "Эквити",
  note: "Кривая накопленного результата рисует сама себя и начинается заново",
  init(){
    this.pts = walk(260, 0, 1.30).map((v, i) => v + i * 0.26);
    this.head = MOTION ? 0 : this.pts.length - 1;   // без движения — сразу целиком
  },
  draw(dt){
    const n = this.pts.length;
    this.head += dt * 34;
    if (this.head > n + 40){ this.head = 0; this.init(); }

    let mn = Math.min(...this.pts), mx = Math.max(...this.pts);
    const pad = (mx - mn) * 0.55 || 1; mn -= pad; mx += pad;
    const X = i => (i / (n - 1)) * W;
    const Y = v => H * 0.62 - ((v - mn) / (mx - mn)) * H * 0.42 + H * 0.14;

    const upto = Math.min(n - 1, Math.floor(this.head));
    if (upto < 1) return;

    ctx.beginPath();
    ctx.moveTo(X(0), H);
    for (let i = 0; i <= upto; i++) ctx.lineTo(X(i), Y(this.pts[i]));
    ctx.lineTo(X(upto), H); ctx.closePath();
    const g = ctx.createLinearGradient(0, H * 0.2, 0, H);
    g.addColorStop(0, `rgba(${C.pos},${.085 * K})`);
    g.addColorStop(1, `rgba(${C.pos},0)`);
    ctx.fillStyle = g; ctx.fill();

    ctx.beginPath();
    for (let i = 0; i <= upto; i++){
      const x = X(i), y = Y(this.pts[i]);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.strokeStyle = `rgba(${C.pos},${Math.min(.9, .34 * K)})`;
    ctx.lineWidth = 1.4; ctx.lineJoin = "round"; ctx.stroke();

    const hx = X(upto), hy = Y(this.pts[upto]);
    const halo = ctx.createRadialGradient(hx, hy, 0, hx, hy, 46);
    halo.addColorStop(0, `rgba(${C.pos},${.30 * K})`);
    halo.addColorStop(1, `rgba(${C.pos},0)`);
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(hx, hy, 46, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(${C.pos},${Math.min(1, .8 * K)})`;
    ctx.beginPath(); ctx.arc(hx, hy, 2, 0, 7); ctx.fill();
  }
};

/* ============ 3. Стакан ============ */
const depth = {
  name: "Стакан",
  note: "Заявки на покупку и продажу дышат по обе стороны от центра",
  init(){
    this.rows = Math.max(14, Math.floor(H / 26));
    this.bid = []; this.ask = [];
    for (let i = 0; i < this.rows; i++){
      this.bid.push({ v: Math.random(), tgt: Math.random(), ph: Math.random() * 6 });
      this.ask.push({ v: Math.random(), tgt: Math.random(), ph: Math.random() * 6 });
    }
    this.t = 0;
  },
  draw(dt){
    this.t += dt;
    const rh = H / this.rows, bh = Math.max(2, rh * 0.42);
    const side = (arr, col, fromLeft) => {
      for (let i = 0; i < arr.length; i++){
        const r = arr[i];
        if (Math.random() < 0.010) r.tgt = Math.random();
        r.v += (r.tgt - r.v) * Math.min(1, dt * 1.6);
        const breathe = 0.86 + 0.14 * Math.sin(this.t * 0.7 + r.ph);
        const w = r.v * breathe * W * 0.40;
        const y = i * rh + (rh - bh) / 2;
        const x = fromLeft ? 0 : W - w;
        const g = ctx.createLinearGradient(fromLeft ? 0 : W, 0, fromLeft ? w : W - w, 0);
        g.addColorStop(0, `rgba(${col},${.16 * K})`);
        g.addColorStop(1, `rgba(${col},${.015 * K})`);
        ctx.fillStyle = g; ctx.fillRect(x, y, w, bh);
      }
    };
    side(this.bid, C.pos, true);
    side(this.ask, C.neg, false);
    ctx.strokeStyle = `rgba(${C.grid},${.05 * K})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
  }
};

/* ============ 4. Лента ============ */
const tape = {
  name: "Лента",
  note: "Поток котировок: цифры медленно плывут и изредка вспыхивают",
  init(){
    this.cw = 62; this.rh = 26;
    this.cols = Math.ceil(W / this.cw) + 1;
    this.rowsN = Math.ceil(H / this.rh) + 1;
    this.cells = [];
    for (let r = 0; r < this.rowsN; r++){
      const row = [];
      for (let c = 0; c < this.cols; c++) row.push({ v: Math.random() * 4 - 2, flash: 0 });
      this.cells.push(row);
    }
    this.off = 0;
  },
  draw(dt){
    this.off = (this.off + dt * 9) % this.rh;
    ctx.font = '11px "Geist Mono", ui-monospace, monospace';
    ctx.textBaseline = "middle";
    for (let r = 0; r < this.rowsN; r++){
      for (let c = 0; c < this.cols; c++){
        const cell = this.cells[r][c];
        if (Math.random() < 0.0016){ cell.v = Math.random() * 4 - 2; cell.flash = 1; }
        cell.flash = Math.max(0, cell.flash - dt * 1.5);
        const x = c * this.cw + 8;
        const y = r * this.rh - this.off + this.rh / 2;
        const up = cell.v >= 0;
        const col = up ? C.pos : C.neg;
        const dy = Math.abs(y - H / 2) / (H / 2);
        const base = (0.06 + 0.07 * (1 - dy)) * K;
        const alpha = Math.min(1, base + cell.flash * 0.42 * K);
        if (GLOW > 0 && cell.flash > 0.05){
          ctx.shadowBlur = 14 * GLOW * cell.flash;
          ctx.shadowColor = `rgba(${col},${alpha})`;
        }
        ctx.fillStyle = `rgba(${col},${alpha})`;
        ctx.fillText((up ? "+" : "") + cell.v.toFixed(2) + "%", x, y);
        ctx.shadowBlur = 0;
      }
    }
  }
};

/* ============ движок ============ */
const VARIANTS = [candles, equity, depth, tape];
let current = null, prev = 0;

function pickBg(i){
  current = VARIANTS[i];
  if (W && H) current.init();
}

function frame(ts){
  const dt = Math.min(0.05, (ts - prev) / 1000 || 0);
  prev = ts;
  if (!W || !H){ if (innerWidth && innerHeight) resize(); requestAnimationFrame(frame); return; }
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = `rgb(${C.base})`; ctx.fillRect(0, 0, W, H);
  if (current) current.draw(MOTION ? dt : 0);
  requestAnimationFrame(frame);
}

const meter = document.getElementById("meter"), meterTxt = document.getElementById("meterTxt");
function scorePw(v){
  let n = 0;
  if (v.length >= 8) n++;
  if (v.length >= 12) n++;
  if (/[A-ZА-Я]/.test(v) && /[a-zа-я]/.test(v)) n++;
  if (/\d/.test(v) && /[^\wа-яА-Я]/.test(v)) n++;
  return Math.min(4, n);
}
pw.addEventListener("input", () => {
  if (meter.hidden) return;
  const lvl = pw.value ? scorePw(pw.value) : 0;
  meter.dataset.lvl = String(lvl);
  meterTxt.textContent = pw.value ? T.lvl[lvl] : "";
});

  if (goBtn.classList.contains("busy") || goBtn.classList.contains("done")) return;

  const reg = document.querySelector('.tabs button.on').dataset.tab === "up";
  const nick = document.getElementById("nick");
  const empty = (reg ? [nick, em, pw] : [em, pw]).filter(i => !i.value.trim());
  if (empty.length){
    empty.forEach(markBad);
    shell.classList.remove("shake"); void shell.offsetWidth;
    shell.classList.add("shake");
    empty[0].focus();
    return;
  }

  // всё заполнено: крутилка, потом галочка
  goBtn.classList.add("busy");
  setTimeout(() => {
    goBtn.classList.remove("busy");
    goBtn.classList.add("done");

});

/* ============================================================
   Параллакс. Слои двигаются за курсором с разной силой:
   свечи позади — сильнее всех, цитата — слабее, карточка почти
   стоит на месте и лишь наклоняется. Разная скорость и создаёт
   ощущение глубины.
   ============================================================ */
if (matchMedia("(hover: hover) and (pointer: fine)").matches){
  const TILT = 4;          // наклон карточки, градусов
  const SHIFT_BG = 26;     // насколько уводим фон со свечами, пикселей
  const SHIFT_TXT = 10;    // насколько уводим цитату
  const SHIFT_CARD = 5;    // и саму карточку

  const headline = document.getElementById("headline");
  let raf = 0, tx = 0, ty = 0, cx = 0, cy = 0;

  addEventListener("pointermove", e => {
    // -1 … 1 от центра экрана
    tx = (e.clientX / innerWidth  - .5) * 2;
    ty = (e.clientY / innerHeight - .5) * 2;
    if (!MOTION || raf) return;
    raf = requestAnimationFrame(step);
  });

  function step(){
    raf = 0;
    // догоняем курсор плавно, иначе слои дёргаются вслед за каждым движением
    cx += (tx - cx) * .08;
    cy += (ty - cy) * .08;

    cv.style.transform =
      `translate3d(${(-cx * SHIFT_BG).toFixed(1)}px, ${(-cy * SHIFT_BG * .6).toFixed(1)}px, 0)`;
    if (headline) headline.style.transform =
      `translate3d(${(-cx * SHIFT_TXT).toFixed(1)}px, ${(-cy * SHIFT_TXT * .6).toFixed(1)}px, 0)`;
    shell.style.transform =
      `translate3d(${(-cx * SHIFT_CARD).toFixed(1)}px, ${(-cy * SHIFT_CARD * .6).toFixed(1)}px, 0)`
      + ` rotateY(${(cx * TILT).toFixed(2)}deg) rotateX(${(-cy * TILT).toFixed(2)}deg)`;

    // пока не пришли в цель — продолжаем догонять
    if (Math.abs(tx - cx) > .001 || Math.abs(ty - cy) > .001)
      raf = requestAnimationFrame(step);
  }

  addEventListener("pointerleave", () => { tx = ty = 0; if (!raf) raf = requestAnimationFrame(step); });
}



/* localStorage отдаёт null, если ключа нет — проверяем отдельно,
   иначе значение по умолчанию превращалось бы в ноль */
function stored(key, def, max){
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return def;
    const n = parseInt(raw, 10);
    return Number.isFinite(n) ? Math.min(max, Math.max(0, n)) : def;
  } catch(e){ return def; }
}
