<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal — календарь месяца</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap">
<style>
:root{
  --ink:#08080a; --panel:rgba(255,255,255,.042); --panel-2:rgba(255,255,255,.055);
  --panel-3:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.05);
  --text:#f0f0f1; --dim:#94949a; --faint:#63636b;
  --pos:#93c1a8; --neg:#c39a9c; --be:#b6ae95;
  --accent:#d4d6da;
  --card:linear-gradient(180deg,rgba(255,255,255,.062),rgba(255,255,255,.016));
  --card-lip:inset 0 1px 0 rgba(255,255,255,.08);
  /* набор шрифтов подставляется переключателем */
  --sans:"Geist","Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,monospace;
  --num:var(--mono);          /* чем набраны цифры */
  --h-weight:600; --h-track:-.03em;
}
*{box-sizing:border-box}
/* световой слой: мягкие светлые пятна за интерфейсом */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1150px 760px at 66% -12%, rgba(255,255,255,.165), transparent 62%),
    radial-gradient(720px 540px at 97% 10%, rgba(255,255,255,.105), transparent 62%),
    radial-gradient(800px 580px at -5% -8%, rgba(255,255,255,.085), transparent 64%),
    radial-gradient(1000px 680px at 100% 104%, rgba(255,255,255,.07), transparent 62%)}
.side,.main{position:relative;z-index:1}
html{scrollbar-gutter:stable;overflow-y:scroll}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:216px 1fr}

/* ================= левая панель ================= */
.side{position:sticky;top:0;height:100vh;font-weight:400;line-height:1.5;scrollbar-gutter:stable;border-right:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  padding:18px 14px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px}
.brand .mark{width:32px;height:32px;border-radius:10px;
  background:linear-gradient(150deg,rgba(255,255,255,.20),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.12);
  display:grid;place-items:center;flex:none}
.brand .nm{font-weight:650;font-size:14px;letter-spacing:-.01em}
.brand .nm small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);font-weight:400}

.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:12px;
  border:1px solid rgba(255,255,255,.09);
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
  color:var(--text);font:inherit;font-size:13px;
  cursor:pointer;transition:background .18s}
.newbtn:hover{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06))}

/* навигация — теперь здесь */
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;color:var(--dim);
  text-decoration:none;font-size:13.5px;border:1px solid transparent;transition:.18s}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav a.on{color:var(--text);background:rgba(255,255,255,.085);
  border-color:rgba(255,255,255,.10);font-weight:600}
.nav a.on .ic{opacity:.9}
.nav .ic{opacity:.45;flex:none}

.side .grp{display:flex;flex-direction:column;gap:6px}
.side .lab{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);padding:0 5px}
.mini{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.04);
  background:rgba(255,255,255,.045);color:var(--dim);font-size:12.5px;cursor:pointer;transition:.18s}
.mini:hover{color:var(--text);background:rgba(255,255,255,.075)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}

/* переключатель шрифтов */

/* ================= рабочая область ================= */
.main{padding:22px 24px 30px;min-width:0}
.head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.head h1{margin:0;font-size:22px;font-weight:var(--h-weight);letter-spacing:var(--h-track)}
.head .sub{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px}
.head .per{margin-left:auto;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:3px}
.head .per button{border:none;background:none;color:var(--dim);font:inherit;font-size:12px;padding:6px 12px;
  border-radius:8px;cursor:pointer}
.head .per button.on{background:var(--panel-3);color:var(--text)}

/* ---- рабочая область: бенто слева, стопка карточек справа ---- */
.cols{display:grid;grid-template-columns:1fr 296px;gap:12px;align-items:start}
.rcol{display:flex;flex-direction:column;gap:12px}

/* ---- бенто-сетка ---- */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.b{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;
  box-shadow:var(--card-lip),0 34px 70px -46px rgba(0,0,0,.95)}
.b.big{grid-column:span 8;grid-row:span 2}
.b.side4{grid-column:span 4}
.b.wide{grid-column:span 12}
.b.half{grid-column:span 6}

.btitle{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.btitle h2{margin:0;font-size:14px;font-weight:600}
.btitle .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.btitle .r{margin-left:auto;font-family:var(--num);font-size:12px}
.btitle .r.pos{color:var(--pos)} .btitle .r.neg{color:var(--neg)}
.pager{margin-left:auto;display:flex;gap:5px}
.pager span{width:26px;height:26px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);
  display:grid;place-items:center;cursor:pointer}
.pager span:hover{background:var(--panel-3)}

/* ---- крупный итог месяца + лента дней ---- */
.hero .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.hero-top{display:flex;align-items:flex-end;gap:20px;margin-bottom:18px}
.hero-top > div{flex:1;min-width:0}
.hero-val{font-family:var(--num);font-size:42px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin-top:6px}
.hero-val.pos{color:var(--pos)} .hero-val.neg{color:var(--neg)}
.hero-sub{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
.strip-head{display:flex;align-items:center;margin-bottom:8px}
.strip-head .more{margin-left:auto;font-size:11.5px;color:var(--dim);text-decoration:none}
.strip-head .more:hover{color:var(--text)}
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.strip .day{aspect-ratio:.92}
.strip .day .dn{font-size:9.5px}
.strip .day .wd{font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.strip .day .dr{font-size:11.5px}

/* ---- показатели ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcell{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--line-soft);border-radius:13px;padding:10px 11px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.mcell .lab{font-family:var(--mono);font-size:9px;letter-spacing:.10em;text-transform:uppercase;color:var(--faint)}
.mcell .val{font-family:var(--num);font-size:18px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.mcell .val.pos{color:var(--pos)} .mcell .val.neg{color:var(--neg)}

/* ---- календарь ---- */
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-wd span{font-family:var(--mono);font-size:9px;letter-spacing:.10em;text-transform:uppercase;color:var(--faint);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1.5;border-radius:13px;border:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  padding:7px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:.18s}
.day:hover{border-color:rgba(255,255,255,.16)}
.day.empty{background:none;border-color:transparent;cursor:default}
.day .dn{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.day .tags{display:flex;flex-wrap:wrap;gap:3px}
.day .tags b{font-family:var(--mono);font-size:8.5px;font-weight:500;padding:1px 4px;border-radius:4px;
  background:rgba(255,255,255,.09);color:var(--dim)}
.day .tags b.w{background:rgba(163,188,172,.20);color:var(--pos)}
.day .tags b.l{background:rgba(193,158,154,.18);color:var(--neg)}
.day .tags b.b{background:rgba(184,178,158,.16);color:var(--be)}
.day .dr{margin-top:auto;font-family:var(--num);font-size:12.5px;font-weight:600}
.day.pos{background:linear-gradient(160deg,rgba(163,188,172,.13),rgba(163,188,172,.04));border-color:rgba(163,188,172,.22)}
.day.pos .dr{color:var(--pos)}
.day.neg{background:linear-gradient(160deg,rgba(193,158,154,.12),rgba(193,158,154,.03));border-color:rgba(193,158,154,.20)}
.day.neg .dr{color:var(--neg)}
.day.be{background:linear-gradient(160deg,rgba(184,178,158,.10),rgba(184,178,158,.03));border-color:rgba(184,178,158,.18)}
.day.be .dr{color:var(--be)}

/* ---- кольцо Win Rate ---- */
.ring{position:relative;display:grid;place-items:center;margin-top:2px}
.ring .val{position:absolute;text-align:center}
.ring .val b{display:block;font-family:var(--num);font-size:20px;font-weight:600}
.ring .val small{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.08em}
.legend{display:flex;justify-content:center;gap:13px;margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.legend i{width:7px;height:7px;border-radius:2px}

/* ---- строки ---- */
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row .nm{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;color:var(--faint);font-size:10px;font-family:var(--mono)}
.row .v{font-family:var(--num);font-size:12.5px}
.row .v.pos{color:var(--pos)} .row .v.neg{color:var(--neg)} .row .v.be{color:var(--be)}
.chip{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--dim)}

.sbar{display:flex;gap:4px;height:9px;margin:10px 0 8px}
.sbar i{border-radius:5px;background:rgba(255,255,255,.12)}
.sbar i.a{background:linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,.32))} .sbar i.b{background:rgba(255,255,255,.28)} .sbar i.c{background:rgba(255,255,255,.18)}
.smarks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--faint)}

/* ---- эквити ---- */
.eqhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.eqhead .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.eqhead b{font-family:var(--num);font-size:15px;color:var(--pos)}
.eqhead .dd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.plot{display:grid;grid-template-columns:30px 1fr;gap:8px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);font-size:9px;
  color:var(--faint);text-align:right;padding:2px 0 10px}
.xax{display:grid;text-align:center;font-family:var(--mono);font-size:9px;color:var(--faint);
  margin-left:38px;margin-top:5px}
svg{display:block}
.ic{opacity:.5}

/* ---- журнал: легенда, выбранный день, карточки сделок ---- */
.callegend{display:flex;align-items:center;gap:16px;margin-top:12px;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.callegend span{display:flex;align-items:center;gap:5px}
.callegend i{width:6px;height:6px;border-radius:2px;background:rgba(255,255,255,.3)}
.callegend i.w{background:var(--pos)} .callegend i.l{background:var(--neg)} .callegend i.be{background:var(--be)}
.callegend .hint{margin-left:auto}
.cal .day.sel{border-color:rgba(255,255,255,.45);box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.trade{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.trade:last-child{border-bottom:none}
.tline{display:flex;align-items:center;gap:8px}
.tline b{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tline .v{font-family:var(--num);font-size:12.5px}
.tline .v.pos{color:var(--pos)} .tline .v.neg{color:var(--neg)} .tline .v.be{color:var(--be)}
.tmeta{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:3px}
.empty{color:var(--faint);font-size:12.5px;padding:14px 0;text-align:center}
</style>
</head>
<body>

<!-- ================= левая панель ================= -->
<aside class="side">
  <div class="brand">
    <div class="mark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="ic"><path d="M3 17l5-6 4 3 5-8 4 5" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="nm">Journal<small>Trading</small></div>
  </div>

  <button class="newbtn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" class="ic"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg>
    Новая сделка
  </button>

  <nav class="nav">
    <a href="dash.html">
      <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7.5" height="9" rx="2" stroke="#fff" stroke-width="1.6"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="2" stroke="#fff" stroke-width="1.6"/><rect x="13.5" y="12" width="7.5" height="9" rx="2" stroke="#fff" stroke-width="1.6"/><rect x="3" y="15.5" width="7.5" height="5.5" rx="2" stroke="#fff" stroke-width="1.6"/></svg>
      Dashboard
    </a>
    <a href="journal.html" class="on">
      <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="3" stroke="#fff" stroke-width="1.6"/><path d="M3 9h18M8 3v3M16 3v3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
      Journal
    </a>
    <a href="#">
      <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 16l5-5 3 3 7-8" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6h5v5" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Analytics
    </a>
  </nav>

  <div class="grp">
    <div class="lab">Быстро</div>
    <div class="mini">
      <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v12M8 11l4 4 4-4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
      Импорт
    </div>
    <div class="mini">
      <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 21V9M8 13l4-4 4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 7V5a2 2 0 012-2h12a2 2 0 012 2v2" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
      Экспорт
    </div>
    <div class="mini">
      <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="#fff" stroke-width="1.6"/><circle cx="8.5" cy="10" r="1.6" stroke="#fff" stroke-width="1.5"/><path d="M4 17l5-4 4 3 3-2 4 3" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Картинка месяца
    </div>
  </div>

</aside>

<!-- ================= рабочая область ================= -->
<main class="main">
  <div class="head">
    <div>
      <h1>Журнал</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="per"><button class="on">Календарь</button><button>Списком</button></div>
  </div>

  <div class="cols">
    <div class="bento">
      <div class="b wide">
        <div class="btitle">
          <h2 id="calTitle"></h2><span class="n" id="calSub"></span>
          <span class="pager">
            <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" class="ic"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" class="ic"><path d="M9 5l7 7-7 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </span>
        </div>
        <div id="cal"></div>
        <div class="callegend">
          <span><i class="w"></i>тейк</span><span><i class="l"></i>стоп</span><span><i class="be"></i>безубыток</span>
          <span class="hint">клик по дню — сделки справа</span>
        </div>
      </div>

      <div class="b half">
        <div class="btitle"><h2>Показатели месяца</h2></div>
        <div class="grid2" id="mStats"></div>
      </div>

      <div class="b half">
        <div class="btitle"><h2>Год целиком</h2><span class="r pos" id="yNet"></span></div>
        <div class="grid2" id="yStats"></div>
      </div>
    </div>

    <div class="rcol">
      <div class="b">
        <div class="btitle"><h2 id="dayTitle">День</h2><span class="r" id="dayNet"></span></div>
        <div id="dayList"></div>
      </div>

      <div class="b">
        <div class="btitle"><h2>Дни месяца</h2><span class="n" id="daysN"></span></div>
        <div id="monthRows"></div>
      </div>
    </div>
  </div>
</main>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
$("#sub").textContent = monthTitle() + " · " + D.cur.n + " сделок · " + fmt(D.cur.net);
$("#calTitle").textContent = monthTitle();
$("#calSub").textContent = D.cur.n + " сделок · " + fmt(D.cur.net);
$("#cal").innerHTML = calendarHTML();

const cell = m => '<div class="mcell"><div class="lab">' + m[0] + '</div><div class="val ' + m[2] + '">' + m[1] + '</div></div>';
$("#mStats").innerHTML = metrics(D.cur).map(cell).join("");
$("#yStats").innerHTML = metrics(D.year).map(cell).join("");
$("#yNet").textContent = fmt(D.year.net);

const monthName = MONF[+D.curYm.slice(5, 7) - 1].toLowerCase();

/* панель дня — по клику на квадратик */
function showDay(d){
  const list = D.byday[String(d).padStart(2, "0")] || [];
  const net = list.reduce((a, t) => a + t.r, 0);
  $("#dayTitle").textContent = d + " " + monthName;
  $("#dayNet").textContent = list.length ? fmt(net) : "";
  $("#dayNet").className = "r " + sign(net);
  $("#dayList").innerHTML = list.length
    ? list.map(t =>
        '<div class="trade">' +
          '<div class="tline"><span class="chip">' + tagOf(t.res) + '</span>' +
            '<b>' + t.pair + ' · ' + t.pos + '</b>' +
            '<span class="v ' + sign(t.r) + '">' + fmt(t.r) + '</span></div>' +
          '<div class="tmeta">' + t.time + ' · ' + t.sess + ' · RR ' + (t.rr == null ? "—" : t.rr) +
            ' · риск ' + (t.risk == null ? "—" : t.risk) + '%</div>' +
          '<div class="tmeta">' + (t.setup || "без сетапа") + '</div>' +
        '</div>').join("")
    : '<div class="empty">В этот день сделок не было</div>';
  const cells = document.querySelectorAll(".cal .day");
  cells.forEach(el => el.classList.remove("sel"));
  const c = cells[D.first + d - 1];
  if (c) c.classList.add("sel");
}
document.querySelectorAll(".cal .day").forEach((el, i) => {
  const d = i - D.first + 1;
  if (d >= 1 && d <= D.grid.length) el.onclick = () => showDay(d);
});
showDay(Math.max.apply(null, Object.keys(D.byday).map(Number)));

/* список дней со сделками */
const withTrades = D.grid.filter(g => g.n);
$("#daysN").textContent = withTrades.length + " дней со сделками";
$("#monthRows").innerHTML = withTrades.map(g =>
  '<div class="row" onclick="showDay(' + g.d + ')" style="cursor:pointer">' +
  '<span class="nm">' + g.d + ' ' + monthName + '<small>' + g.n + (g.n === 1 ? " сделка" : " сделки") + '</small></span>' +
  '<span class="v ' + sign(g.r) + '">' + fmt(g.r) + '</span></div>').join("");
</script>
</body>
</html>
