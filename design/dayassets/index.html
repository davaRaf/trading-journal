<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<title>Пробник: кілька активів в «Аналізі дня»</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Ранковий план, коли активів кілька. Обраний варіант: кожен актив —
   своя картка, картки одна під одною. Нічого не перемикається, увесь
   ранок видно згори вниз.

   Що тут вирішено, крім самих карток:

   • Скріни по таймфреймах. Один графік розмітки нічого не пояснює:
     людина дивиться 1D для контексту, 1H для зони, 15m для входу.
     Тому в кожного активу окремі слоти під таймфрейми, як у «Моїй ТС»
     і в картці угоди.

   • Звідки беруться активи. Список підказує «Моя ТС»: якщо там
     написано, що людина торгує US100 і золото — саме вони й
     пропонуються. Далі йдуть інструменти, які вже є в журналі. Руками
     вписати теж можна.

   • Правила дня спільні: вони не про актив, а про поведінку.

   Це макет: цифри зашиті, сервер не потрібен, застосунок із кореня
   репозиторію він не чіпає.
   ============================================================ */
:root{
  --bg:#050505; --panel:#0d0d0e; --panel-2:#111112; --panel-3:#161617;
  --line:rgba(255,255,255,.08); --line-soft:rgba(255,255,255,.045);
  --text:#f2f2f3; --dim:#8c8c90; --faint:#5c5c61;
  --accent:#40e094; --accent-ink:#06130d; --accent-soft:rgba(64,224,148,.12);
  --up:#40e094; --down:#ff6e60; --be:#efc258;
  --up-soft:rgba(64,224,148,.13); --down-soft:rgba(255,110,96,.13);
  --sans:"Geist","Segoe UI",system-ui,sans-serif;
  --mono:"Archivo","Geist",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:15px; -webkit-font-smoothing:antialiased; padding:28px 24px 120px}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
[hidden]{display:none !important}

.page{max-width:1080px; margin:0 auto}
.vhead{display:flex; align-items:baseline; gap:12px; margin-bottom:6px}
.vhead h1{margin:0; font-size:24px; letter-spacing:-.01em}
.vhead .sub{font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; color:var(--faint)}
.hint{color:var(--dim); font-size:13.5px; margin:0 0 22px; line-height:1.55; max-width:78ch}

/* ---------- картка активу ---------- */
.stack{display:flex; flex-direction:column; gap:14px}
.acard{background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.ahead{display:flex; align-items:center; gap:10px; padding:13px 18px;
  border-bottom:1px solid var(--line-soft); background:var(--panel-2)}
.ahead .nm{font-family:var(--mono); font-size:14.5px; font-weight:600; letter-spacing:.02em}
.ahead .from{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); background:var(--accent-soft); padding:3px 8px; border-radius:99px}
.ahead .tag{font-family:var(--mono); font-size:10px; letter-spacing:.1em; padding:3px 9px;
  border-radius:99px}
.ahead .tag.long{background:var(--up-soft); color:var(--up)}
.ahead .tag.short{background:var(--down-soft); color:var(--down)}
.ahead .sp{flex:1}
.ahead .x{color:var(--faint); font-size:16px; line-height:1; padding:4px 8px; border-radius:6px}
.ahead .x:hover{color:var(--text); background:var(--panel-3)}
.abody{padding:18px}

.blk{border-top:1px solid var(--line-soft); padding:18px 0}
.blk:first-child{border-top:none; padding-top:0}
.blk:last-child{padding-bottom:0}
.pt{display:flex; align-items:baseline; gap:9px; margin-bottom:12px}
.pt b{font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--accent);
  background:var(--accent-soft); padding:3px 7px; border-radius:99px; font-weight:600}
.pt span{font-size:14.5px; font-weight:600}
.pt i{font-style:normal; font-size:12px; color:var(--faint)}

/* ---------- скріни по таймфреймах ---------- */
.tfs{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px}
.tf{display:flex; flex-direction:column; gap:7px}
.tf .cap{display:flex; align-items:center; gap:7px}
.tf .code{font-family:var(--mono); font-size:11px; letter-spacing:.08em; padding:4px 9px;
  border-radius:7px; background:var(--panel-3); border:1px solid var(--line-soft); color:var(--text)}
.tf .code.pick{color:var(--faint); border-style:dashed}
.tf .role{font-size:12px; color:var(--faint)}
.tf .box{border:1px solid var(--line); border-radius:10px; aspect-ratio:16/10; display:grid;
  place-items:center; font-size:12px; color:var(--dim);
  background:linear-gradient(160deg,#12181c,#0c1014)}
.tf .box.empty{border-style:dashed; background:var(--panel-2); color:var(--faint)}
.tf .box.empty:hover{border-color:var(--faint); color:var(--dim)}
.tf .box .mk{font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase}

/* ---------- напрям, рівні, сценарії ---------- */
.side-pick{display:flex; gap:6px; margin-bottom:10px}
.side-pick span{font-family:var(--mono); font-size:11px; letter-spacing:.08em;
  padding:5px 12px; border-radius:99px; border:1px solid var(--line); color:var(--faint)}
.side-pick span.on.long{background:var(--up-soft); border-color:transparent; color:var(--up)}
.side-pick span.on.short{background:var(--down-soft); border-color:transparent; color:var(--down)}
.why{font-size:13.5px; color:var(--dim); line-height:1.55}

.lv{display:flex; flex-direction:column; gap:6px}
.lvr{display:grid; grid-template-columns:100px 1fr 1.3fr; gap:10px; align-items:center;
  padding:9px 11px; border:1px solid var(--line-soft); border-radius:9px; background:var(--panel-2)}
.lvr .p{font-family:var(--mono); font-size:13.5px}
.lvr .t{font-size:13px}
.lvr .n{font-size:12.5px; color:var(--faint)}
.add{margin-top:9px; font-size:12.5px; color:var(--dim); border:1px dashed var(--line);
  border-radius:8px; padding:7px 12px}
.add:hover{color:var(--text); border-color:var(--faint)}

.sc{display:grid; gap:8px}
.sc div{padding:10px 12px; border:1px solid var(--line-soft); border-radius:9px;
  background:var(--panel-2); font-size:13.5px; line-height:1.5}
.sc div b{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint); margin-bottom:4px; font-weight:500}

/* ---------- додати актив ---------- */
.addwrap{position:relative; align-self:flex-start}
.addbig{display:flex; align-items:center; gap:9px; padding:13px 18px; border-radius:12px;
  border:1px dashed var(--line); color:var(--dim); font-size:13.5px; background:var(--panel)}
.addbig:hover{color:var(--text); border-color:var(--faint)}
.pop{position:absolute; left:0; top:calc(100% + 8px); z-index:20; width:290px;
  background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.75)}
.pop .grp{margin-bottom:12px}
.pop .grp:last-child{margin-bottom:0}
.pop .lbl{font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--faint); margin-bottom:7px; display:flex; align-items:center; gap:6px}
.pop .lbl em{font-style:normal; color:var(--accent)}
.pop .chips{display:flex; flex-wrap:wrap; gap:6px}
.pop .chips button{font-family:var(--mono); font-size:12px; padding:6px 11px; border-radius:8px;
  background:var(--panel-2); border:1px solid var(--line-soft); color:var(--text)}
.pop .chips button:hover{border-color:var(--accent); color:var(--accent)}
.pop .chips button[disabled]{opacity:.35; cursor:default; border-color:var(--line-soft)}
.pop .own{display:flex; gap:7px}
.pop .own input{flex:1; min-width:0; background:var(--panel-2); border:1px solid var(--line);
  border-radius:8px; padding:8px 10px; color:var(--text); font:inherit; font-size:13px}
.pop .own input:focus{outline:none; border-color:var(--accent)}
.pop .own button{padding:8px 12px; border-radius:8px; background:var(--accent);
  color:var(--accent-ink); font-size:13px; font-weight:500}

/* ---------- спільне на день ---------- */
.common{margin-top:14px; border:1px solid var(--line); border-radius:14px; background:var(--panel);
  padding:18px 20px}
.common .ttl{display:flex; align-items:baseline; gap:9px; margin-bottom:10px}
.common .ttl b{font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--faint);
  text-transform:uppercase; font-weight:500}
.common .ttl span{font-size:14.5px; font-weight:600}
.common ul{margin:0; padding-left:18px; color:var(--dim); font-size:13.5px; line-height:1.75}

@media (max-width:900px){
  body{padding:18px 14px 80px}
  .lvr{grid-template-columns:1fr; gap:4px}
  .tfs{grid-template-columns:1fr}
  .pop{width:min(290px,calc(100vw - 40px))}
}
</style>
</head>
<body>

<div class="page">
  <div class="vhead"><h1>Аналіз дня</h1><span class="sub">ЧТ, 3 ВЕРЕСНЯ · РАНОК</span></div>
  <p class="hint">Кожен актив — своя картка. Скріни всередині розкладені по таймфреймах:
    старший для контексту, молодший для входу. Активи підказує ваша ТС.</p>
  <div id="view"></div>
</div>

<script>
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Що написано в «Моїй ТС» — звідси й береться перелік активів. */
const FROM_TS = ["US100", "GER40", "XAUUSD"];
/* Що вже зустрічалось у журналі, але в ТС не записано. */
const FROM_JOURNAL = ["US30", "EURUSD", "BTCUSD"];

const COMMON = ["Не входити за 15 хвилин до новин о 15:30",
                "Не більше 3 угод за день",
                "Після двох стопів поспіль — вимикаю термінал"];

/* Ранок, як він виглядає заповненим. shots — по таймфреймах:
   код таймфрейму, навіщо він і чи вже вставлено скрін. */
let assets = [
  {nm:"US100", ts:true, side:"long",
   why:"Тижневий у лонг, вчора зняли лоу і повернулись у діапазон. Чекаю продовження вгору.",
   shots:[["1D","контекст",true],["1H","зона",true],["15m","вхід",true]],
   levels:[["23 480","денний лоу","звідси йшов імпульс"],
           ["23 610","POC вчорашнього дня","тут стояв обʼєм"],
           ["23 745","ціль","хай понеділка"]],
   plans:[["Основний","Зняття 23 480 → CISD на 1m → вхід на ретесті"],
          ["Запасний","Якщо зразу пішли вгору — чекаю відкату до 23 610"]]},
  {nm:"GER40", ts:true, side:"short",
   why:"Проти індексів США: не пробили хай тижня з третьої спроби, зверху ліквідність зняли.",
   shots:[["1D","контекст",true],["1H","зона",true],["","",false]],
   levels:[["24 190","хай тижня","звідси розворот"],
           ["24 020","денний VWAP","перша ціль"]],
   plans:[["Основний","Ретест 24 190 знизу → шорт від рівня"],
          ["Запасний","Пробили вгору — сьогодні не торгую GER40"]]},
];

const pt = (n, ttl, sub) => '<div class="pt"><b>' + n + '</b><span>' + esc(ttl)
  + '</span><i>' + esc(sub) + '</i></div>';

/* Слоти під скріни. Заповнені показують таймфрейм і навіщо він,
   порожній чекає вставки, останній — «додати ще таймфрейм». */
function shots(a, ai){
  const cells = a.shots.map((s, i) => s[2]
    ? '<div class="tf"><div class="cap"><span class="code">' + esc(s[0]) + '</span>'
      + '<span class="role">' + esc(s[1]) + '</span></div>'
      + '<div class="box"><span class="mk">розмітка ' + esc(a.nm) + '</span></div></div>'
    : '<div class="tf"><div class="cap"><span class="code pick">таймфрейм</span></div>'
      + '<div class="box empty">клік, Ctrl+V або перетягни</div></div>').join("");
  return '<div class="tfs">' + cells
    + '<div class="tf"><div class="cap"><span class="code pick">+ таймфрейм</span></div>'
    + '<div class="box empty">ще один графік</div></div></div>';
}

const sideRow = a =>
  '<div class="side-pick">'
  + '<span class="' + (a.side === "long" ? "on long" : "") + '">Лонг</span>'
  + '<span class="' + (a.side === "short" ? "on short" : "") + '">Шорт</span>'
  + '<span>Нейтрально</span></div><div class="why">' + esc(a.why) + '</div>';

const levels = a => '<div class="lv">'
  + a.levels.map(l => '<div class="lvr"><span class="p">' + esc(l[0]) + '</span>'
      + '<span class="t">' + esc(l[1]) + '</span>'
      + '<span class="n">' + esc(l[2]) + '</span></div>').join("")
  + '</div><button class="add">+ додати рівень</button>';

const plans = a => '<div class="sc">'
  + a.plans.map(p => '<div><b>' + esc(p[0]) + '</b>' + esc(p[1]) + '</div>').join("")
  + '</div>';

function card(a, i){
  return '<div class="acard">'
    + '<div class="ahead"><span class="nm">' + esc(a.nm) + '</span>'
    +   (a.ts ? '<span class="from">з вашої ТС</span>' : '')
    +   '<span class="tag ' + a.side + '">' + (a.side === "long" ? "Лонг" : "Шорт") + '</span>'
    +   '<span class="sp"></span>'
    +   '<button class="x" onclick="drop(' + i + ')" title="Прибрати актив">×</button></div>'
    + '<div class="abody">'
    +   '<div class="blk">' + pt("01", "Графіки зранку", "по таймфреймах") + shots(a, i) + '</div>'
    +   '<div class="blk">' + pt("02", "Куди дивишся", "лонг чи шорт і чому") + sideRow(a) + '</div>'
    +   '<div class="blk">' + pt("03", "Рівні, які відмітив", "ціна і що це") + levels(a) + '</div>'
    +   '<div class="blk">' + pt("04", "Що плануєш робити", "сценарії на день") + plans(a) + '</div>'
    + '</div></div>';
}

/* Вибір активу. Спершу те, що людина сама написала в ТС: журнал не
   вигадує за неї список інструментів, а бере її ж слова. */
function popup(){
  const taken = assets.map(a => a.nm);
  const chips = (list, ts) => list.map(nm =>
    '<button onclick="pickAsset(\'' + nm + '\',' + (ts ? 1 : 0) + ')"'
    + (taken.indexOf(nm) >= 0 ? " disabled" : "") + '>' + esc(nm) + '</button>').join("");
  return '<div class="pop" id="pop">'
    + '<div class="grp"><div class="lbl"><em>◆</em> з вашої ТС</div>'
    +   '<div class="chips">' + chips(FROM_TS, true) + '</div></div>'
    + '<div class="grp"><div class="lbl">вже були в журналі</div>'
    +   '<div class="chips">' + chips(FROM_JOURNAL, false) + '</div></div>'
    + '<div class="grp"><div class="lbl">свій</div><div class="own">'
    +   '<input id="ownNm" placeholder="напр. USDJPY" aria-label="Свій інструмент">'
    +   '<button onclick="addOwn()">Додати</button></div></div>'
    + '</div>';
}

let popOpen = false;

function draw(){
  document.getElementById("view").innerHTML =
    '<div class="stack">'
    + assets.map(card).join("")
    + '<div class="addwrap">'
    +   '<button class="addbig" onclick="togglePop()">+ додати актив</button>'
    +   (popOpen ? popup() : "")
    + '</div></div>'
    + '<div class="common"><div class="ttl"><b>Спільне на день</b>'
    +   '<span>Чого не робити</span></div><ul>'
    +   COMMON.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul></div>';
}

function togglePop(){ popOpen = !popOpen; draw(); }
function pickAsset(nm, ts){
  assets.push({nm: nm, ts: !!ts, side: "", why: "",
               shots: [["", "", false]], levels: [["", "", ""]], plans: [["Основний", ""]]});
  popOpen = false; draw();
}
function addOwn(){
  const v = (document.getElementById("ownNm").value || "").trim().toUpperCase();
  if (v) pickAsset(v, 0); else document.getElementById("ownNm").focus();
}
function drop(i){ assets.splice(i, 1); draw(); }
window.togglePop = togglePop; window.pickAsset = pickAsset;
window.addOwn = addOwn; window.drop = drop;

document.addEventListener("click", e => {
  if (popOpen && !e.target.closest(".addwrap")){ popOpen = false; draw(); }
});

draw();
</script>
</body>
</html>
