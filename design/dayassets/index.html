<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<title>Пробник: кілька активів в «Аналізі дня»</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Пробник: як вести ранковий план, коли активів кілька.

   Зараз «Аналіз дня» мовчки припускає, що актив один: один скрін
   розмітки, один напрям, один список рівнів. А людина з ранку
   розбирає US100 і GER40 — і незрозуміло, куди дівати другий.

   Тут три відповіді на це. Пульт унизу перемикає між ними, дані
   всередині однакові, щоб порівнювати було чесно.

   Це макет: цифри зашиті, сервер не потрібен, застосунок із кореня
   репозиторію він не чіпає.
   ============================================================ */
:root{
  --bg:#050505; --panel:#0d0d0e; --panel-2:#111112; --panel-3:#161617;
  --line:rgba(255,255,255,.08); --line-soft:rgba(255,255,255,.045);
  --text:#f2f2f3; --dim:#8c8c90; --faint:#5c5c61;
  --accent:#40e094; --accent-ink:#06130d; --accent-soft:rgba(64,224,148,.12);
  --up:#40e094; --down:#ff6e60; --be:#efc258;
  --up-soft:rgba(64,224,148,.13); --down-soft:rgba(255,110,96,.13);
  --sans:"Geist","Segoe UI",system-ui,sans-serif;
  --mono:"Archivo","Geist",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:15px; -webkit-font-smoothing:antialiased; padding:28px 24px 300px}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
[hidden]{display:none !important}

.page{max-width:1080px; margin:0 auto}
.vhead{display:flex; align-items:baseline; gap:12px; margin-bottom:6px}
.vhead h1{margin:0; font-size:24px; letter-spacing:-.01em}
.vhead .sub{font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; color:var(--faint)}
.hint{color:var(--dim); font-size:13.5px; margin:0 0 20px}

/* ---------- спільні дрібниці ---------- */
.blk{border-top:1px solid var(--line-soft); padding:18px 0}
.blk:first-child{border-top:none; padding-top:0}
.pt{display:flex; align-items:baseline; gap:9px; margin-bottom:12px}
.pt b{font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--accent);
  background:var(--accent-soft); padding:3px 7px; border-radius:99px; font-weight:600}
.pt span{font-size:14.5px; font-weight:600}
.pt i{font-style:normal; font-size:12px; color:var(--faint)}

.shot{border:1px dashed var(--line); border-radius:10px; height:132px; display:grid;
  place-items:center; color:var(--faint); font-size:12.5px; background:var(--panel-2)}
.shot.has{border-style:solid; background:linear-gradient(160deg,#12181c,#0c1014); color:var(--dim)}
.shot.has::after{content:"скрін розмітки"; font-family:var(--mono); font-size:10px;
  letter-spacing:.14em; text-transform:uppercase}

.side-pick{display:flex; gap:6px; margin-bottom:9px}
.side-pick span{font-family:var(--mono); font-size:11px; letter-spacing:.08em;
  padding:5px 11px; border-radius:99px; border:1px solid var(--line); color:var(--faint)}
.side-pick span.on.long{background:var(--up-soft); border-color:transparent; color:var(--up)}
.side-pick span.on.short{background:var(--down-soft); border-color:transparent; color:var(--down)}
.why{font-size:13.5px; color:var(--dim); line-height:1.55}

.lv{display:flex; flex-direction:column; gap:6px}
.lvr{display:grid; grid-template-columns:96px 1fr 1.3fr; gap:10px; align-items:center;
  padding:8px 10px; border:1px solid var(--line-soft); border-radius:9px; background:var(--panel-2)}
.lvr .p{font-family:var(--mono); font-size:13.5px}
.lvr .t{font-size:13px}
.lvr .n{font-size:12.5px; color:var(--faint)}
.add{margin-top:9px; font-size:12.5px; color:var(--dim); border:1px dashed var(--line);
  border-radius:8px; padding:7px 12px}
.add:hover{color:var(--text); border-color:var(--faint)}

.sc{display:grid; gap:8px}
.sc div{padding:10px 12px; border:1px solid var(--line-soft); border-radius:9px;
  background:var(--panel-2); font-size:13.5px; line-height:1.5}
.sc div b{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint); margin-bottom:4px; font-weight:500}

.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px}

/* ---------- А: вкладки по активу ---------- */
.tabs{display:flex; gap:6px; align-items:center; margin-bottom:18px; flex-wrap:wrap}
.tab{display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:10px;
  border:1px solid var(--line); background:var(--panel-2); color:var(--dim); font-size:13.5px}
.tab .dot{width:7px; height:7px; border-radius:50%; background:var(--faint)}
.tab.long .dot{background:var(--up)} .tab.short .dot{background:var(--down)}
.tab.on{background:var(--panel-3); color:var(--text); border-color:var(--line);
  box-shadow:inset 0 0 0 1px var(--line)}
.tab .n{font-family:var(--mono); font-size:11px; color:var(--faint)}
.tabadd{padding:8px 12px; border-radius:10px; border:1px dashed var(--line);
  color:var(--faint); font-size:13px}
.tabadd:hover{color:var(--text); border-color:var(--faint)}

/* ---------- Б: активи один під одним ---------- */
.stack{display:flex; flex-direction:column; gap:14px}
.acard{background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.ahead{display:flex; align-items:center; gap:10px; padding:13px 18px;
  border-bottom:1px solid var(--line-soft); background:var(--panel-2)}
.ahead .nm{font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:.02em}
.ahead .tag{font-family:var(--mono); font-size:10px; letter-spacing:.1em; padding:3px 9px;
  border-radius:99px}
.ahead .tag.long{background:var(--up-soft); color:var(--up)}
.ahead .tag.short{background:var(--down-soft); color:var(--down)}
.ahead .sp{flex:1}
.ahead .x{color:var(--faint); font-size:16px; line-height:1; padding:4px 8px; border-radius:6px}
.ahead .x:hover{color:var(--text); background:var(--panel-3)}
.abody{padding:18px}
.acols{display:grid; grid-template-columns:260px 1fr; gap:18px}

/* ---------- В: один план, ярлик активу в рядку ---------- */
.chip{font-family:var(--mono); font-size:10px; letter-spacing:.08em; padding:3px 8px;
  border-radius:6px; background:var(--panel-3); color:var(--dim); border:1px solid var(--line-soft);
  white-space:nowrap}
.chip.us{color:#7fb2ff} .chip.ger{color:#ffc48a} .chip.xau{color:#ffe08a}
.lvr.tagged{grid-template-columns:auto 96px 1fr 1.3fr}
.shots-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.shots-row .one{display:flex; flex-direction:column; gap:7px}
.shots-row .one .cap{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--dim)}
.sc.tagged div{display:flex; gap:10px; align-items:flex-start}
.sc.tagged div .tx{flex:1}

/* ---------- спільний хвіст ---------- */
.common{margin-top:18px; border:1px solid var(--line); border-radius:14px; background:var(--panel);
  padding:18px 20px}
.common .ttl{display:flex; align-items:baseline; gap:9px; margin-bottom:10px}
.common .ttl b{font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--faint);
  text-transform:uppercase; font-weight:500}
.common .ttl span{font-size:14.5px; font-weight:600}
.common ul{margin:0; padding-left:18px; color:var(--dim); font-size:13.5px; line-height:1.75}

/* ---------- пульт ---------- */
.rc{position:fixed; left:16px; bottom:16px; z-index:90; width:320px; background:var(--panel);
  border:1px solid var(--line); border-radius:12px; padding:14px; font-size:13px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.7); transition:transform .3s var(--ease)}
.rc.hid{transform:translateY(calc(100% + 26px))}
.rc .h{font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--faint); margin-bottom:10px}
.rc .opts{display:grid; gap:6px}
.rc .opts button{text-align:left; padding:10px 12px; border-radius:9px; font-size:13px;
  background:var(--panel-2); color:var(--dim); line-height:1.4; border:1px solid transparent}
.rc .opts button b{display:block; color:var(--text); font-weight:600; font-size:13.5px;
  margin-bottom:2px}
.rc .opts button:hover{background:var(--panel-3)}
.rc .opts button.on{background:var(--accent-soft); border-color:rgba(64,224,148,.35)}
.rc .opts button.on b{color:var(--accent)}
.rc .fold{width:100%; margin-top:10px; padding:8px; border-radius:8px; background:var(--panel-2);
  color:var(--dim); font-size:12.5px}
.rc .fold:hover{color:var(--text)}
.rcfold{position:fixed; left:16px; bottom:16px; z-index:89; padding:9px 13px; border-radius:10px;
  background:var(--panel); border:1px solid var(--line); color:var(--dim); font-size:12.5px}

@media (max-width:900px){
  body{padding:18px 14px 320px}
  .acols{grid-template-columns:1fr}
  .lvr{grid-template-columns:1fr; gap:4px}
  .lvr.tagged{grid-template-columns:1fr}
  .shots-row{grid-template-columns:1fr}
  .rc{left:12px; right:12px; width:auto}
}
</style>
</head>
<body>

<div class="page">
  <div class="vhead"><h1>Аналіз дня</h1><span class="sub">ЧТ, 3 ВЕРЕСНЯ · РАНОК</span></div>
  <p class="hint" id="hint"></p>
  <div id="view"></div>
</div>

<div class="rc" id="rc">
  <div class="h">Пробник · кілька активів зранку</div>
  <div class="opts">
    <button data-v="a" class="on"><b>А. Вкладки по активу</b>Кожен актив — свій план. Перемикаєшся вгорі, сторінка не росте.</button>
    <button data-v="b"><b>Б. Активи один під одним</b>Усе видно відразу, без перемикання. Довша сторінка.</button>
    <button data-v="c"><b>В. Один план, ярлик активу</b>Нічого не дублюється: актив проставляється в рядку.</button>
  </div>
  <button class="fold" id="fold">Заховати пульт</button>
</div>
<button class="rcfold" id="rcfold" hidden>Пульт</button>

<script>
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Один і той самий ранок, розказаний трьома способами. Дані спільні,
   щоб різниця була саме в подачі, а не в наповненні. */
const ASSETS = [
  {key:"us", nm:"US100", side:"long", why:"Тижневий у лонг, вчора зняли лоу і повернулись у діапазон. Чекаю продовження вгору.",
   levels:[["23 480","денний лоу","звідси йшов імпульс"],
           ["23 610","POC вчорашнього дня","тут стояв обʼєм"],
           ["23 745","ціль","хай понеділка"]],
   plans:[["Основний","Зняття 23 480 → CISD на 1m → вхід на ретесті"],
          ["Запасний","Якщо зразу пішли вгору — чекаю відкату до 23 610"]]},
  {key:"ger", nm:"GER40", side:"short", why:"Проти індексів США: не пробили хай тижня з третьої спроби, зверху ліквідність зняли.",
   levels:[["24 190","хай тижня","звідси розворот"],
           ["24 020","денний VWAP","перша ціль"]],
   plans:[["Основний","Ретест 24 190 знизу → шорт від рівня"],
          ["Запасний","Пробили вгору — сьогодні не торгую GER40"]]},
];
const COMMON = ["Не входити за 15 хвилин до новин о 15:30",
                "Не більше 3 угод за день",
                "Після двох стопів поспіль — вимикаю термінал"];

let tab = 0;

const pt = (n, ttl, sub) => '<div class="pt"><b>' + n + '</b><span>' + esc(ttl)
  + '</span><i>' + esc(sub) + '</i></div>';

const sideRow = a =>
  '<div class="side-pick">'
  + '<span class="' + (a.side === "long" ? "on long" : "") + '">Лонг</span>'
  + '<span class="' + (a.side === "short" ? "on short" : "") + '">Шорт</span>'
  + '<span>Нейтрально</span></div><div class="why">' + esc(a.why) + '</div>';

const levels = a => '<div class="lv">'
  + a.levels.map(l => '<div class="lvr"><span class="p">' + esc(l[0]) + '</span>'
      + '<span class="t">' + esc(l[1]) + '</span>'
      + '<span class="n">' + esc(l[2]) + '</span></div>').join("")
  + '</div><button class="add">+ додати рівень</button>';

const plans = a => '<div class="sc">'
  + a.plans.map(p => '<div><b>' + esc(p[0]) + '</b>' + esc(p[1]) + '</div>').join("")
  + '</div>';

const common = () => '<div class="common"><div class="ttl"><b>Спільне на день</b>'
  + '<span>Чого не робити</span></div><ul>'
  + COMMON.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul></div>';

/* ---------- А: вкладки ---------- */
function viewA(){
  const a = ASSETS[tab];
  return '<div class="tabs">'
    + ASSETS.map((x, i) => '<button class="tab ' + x.side + (i === tab ? " on" : "")
        + '" onclick="pick(' + i + ')"><span class="dot"></span>' + esc(x.nm)
        + '<span class="n">' + x.levels.length + ' рівні</span></button>').join("")
    + '<button class="tabadd">+ актив</button></div>'
    + '<div class="card">'
    +   '<div class="blk">' + pt("01", "Графік зранку", "скрін розмітки " + a.nm)
    +     '<div class="shot has"></div></div>'
    +   '<div class="blk">' + pt("02", "Куди дивишся", "лонг чи шорт і чому") + sideRow(a) + '</div>'
    +   '<div class="blk">' + pt("03", "Рівні, які відмітив", "ціна і що це") + levels(a) + '</div>'
    +   '<div class="blk">' + pt("04", "Що плануєш робити", "сценарії на день") + plans(a) + '</div>'
    + '</div>'
    + common();
}

/* ---------- Б: один під одним ---------- */
function viewB(){
  return '<div class="stack">'
    + ASSETS.map(a => '<div class="acard">'
      + '<div class="ahead"><span class="nm">' + esc(a.nm) + '</span>'
      +   '<span class="tag ' + a.side + '">' + (a.side === "long" ? "Лонг" : "Шорт") + '</span>'
      +   '<span class="sp"></span><button class="x">×</button></div>'
      + '<div class="abody"><div class="acols">'
      +   '<div><div class="shot has"></div></div>'
      +   '<div>'
      +     '<div class="blk">' + pt("01", "Куди дивишся", "і чому") + sideRow(a) + '</div>'
      +     '<div class="blk">' + pt("02", "Рівні", "ціна і що це") + levels(a) + '</div>'
      +     '<div class="blk">' + pt("03", "Сценарії", "що робиш") + plans(a) + '</div>'
      +   '</div>'
      + '</div></div></div>').join("")
    + '<button class="add" style="align-self:flex-start">+ додати актив</button></div>'
    + common();
}

/* ---------- В: один план, ярлики ---------- */
function viewC(){
  const chip = a => '<span class="chip ' + a.key + '">' + esc(a.nm) + '</span>';
  return '<div class="card">'
    + '<div class="blk">' + pt("01", "Графіки зранку", "скрін на кожен актив")
    +   '<div class="shots-row">'
    +     ASSETS.map(a => '<div class="one"><div class="cap">' + chip(a)
          + '<span>розмітка</span></div><div class="shot has"></div></div>').join("")
    +     '<div class="one"><div class="cap"><span class="chip">+ актив</span></div>'
    +       '<div class="shot">вставити скрін</div></div>'
    +   '</div></div>'
    + '<div class="blk">' + pt("02", "Куди дивишся", "по кожному активу")
    +   ASSETS.map(a => '<div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:12px">'
        + chip(a) + '<div style="flex:1">' + sideRow(a) + '</div></div>').join("")
    + '</div>'
    + '<div class="blk">' + pt("03", "Рівні, які відмітив", "ярлик активу в рядку")
    +   '<div class="lv">'
    +     ASSETS.map(a => a.levels.map(l =>
          '<div class="lvr tagged">' + chip(a)
          + '<span class="p">' + esc(l[0]) + '</span>'
          + '<span class="t">' + esc(l[1]) + '</span>'
          + '<span class="n">' + esc(l[2]) + '</span></div>').join("")).join("")
    +   '</div><button class="add">+ додати рівень</button></div>'
    + '<div class="blk">' + pt("04", "Що плануєш робити", "сценарії на день")
    +   '<div class="sc tagged">'
    +     ASSETS.map(a => a.plans.map(p => '<div>' + chip(a)
          + '<div class="tx"><b>' + esc(p[0]) + '</b>' + esc(p[1]) + '</div></div>').join("")).join("")
    +   '</div></div>'
    + '</div>'
    + common();
}

const HINTS = {
  a: "Активи вгорі вкладками. Клацаєш — бачиш повний план саме цього активу. Правила дня спільні, вони внизу.",
  b: "Кожен актив своєю карткою, одна під одною. Нічого не перемикаєш, але сторінка довша.",
  c: "План один на день, а актив проставляється ярликом у кожному рядку. Найкоротше, але коли активів більше трьох — рябить.",
};
const VIEWS = {a: viewA, b: viewB, c: viewC};
let cur = "a";

function draw(){
  document.getElementById("hint").textContent = HINTS[cur];
  document.getElementById("view").innerHTML = VIEWS[cur]();
}
function pick(i){ tab = i; draw(); }
window.pick = pick;

document.querySelectorAll(".rc .opts button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".rc .opts button").forEach(x => x.classList.toggle("on", x === b));
    cur = b.dataset.v; tab = 0; draw();
  };
});
document.getElementById("fold").onclick = () => {
  document.getElementById("rc").classList.add("hid");
  document.getElementById("rcfold").toggleAttribute("hidden", false);
};
document.getElementById("rcfold").onclick = () => {
  document.getElementById("rc").classList.remove("hid");
  document.getElementById("rcfold").toggleAttribute("hidden", true);
};

draw();
</script>
</body>
</html>
